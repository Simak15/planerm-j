function compName(g){return g.synId?synName(g.synId)||g.compound||'związek':(g.compound||'')}
function finalConc(g){const st=num(g.stock),a=num(g.added),m=num(g.medium);if(st==null||!a||m==null)return null;const u=BUNITS[g.unit||'mg/mL']||BUNITS['mg/mL'];return{v:st*a/(a+m)*u[1],u:u[0]}}
function concStr(g){const c=finalConc(g);return c?`${fmtNum(c.v)} ${c.u}`:''}
function groupDesc(g){const c=compName(g);if(!c&&!g.irr)return'pożywka standardowa';return [c&&(c+(concStr(g)?' '+concStr(g):'')),g.irr&&('naświetlanie'+(g.wl?' '+g.wl+' nm':''))].filter(Boolean).join(' + ')}
const setsOf=id=>Store.list('bset').filter(x=>x.expId===id);
const countsOf=id=>Store.list('bcount').filter(x=>x.expId===id).sort((a,b)=>(a.at||'').localeCompare(b.at||''));
const temsOf=id=>Store.list('btem').filter(x=>x.expId===id);
function quant(a,p){const s=[...a].sort((x,y)=>x-y);const i=(s.length-1)*p;const lo=Math.floor(i),hi=Math.ceil(i);return s[lo]+(s[hi]-s[lo])*(i-lo)}
function niceMax(v){if(!(v>0))return 10;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
const nums=a=>(a||[]).map(num).filter(x=>x!=null);
const msd=a=>{const s=stats(nums(a));return s?`${fmtNum(s.m)} ± ${fmtNum(s.sd)}`:'–'};

/* ---------- wykresy ---------- */
function boxplotSvg(rows,unit){
  const all=rows.flatMap(r=>r.series.flatMap(s=>s.vals));if(!all.length)return'';
  const mx=niceMax(Math.max(...all)*1.05);const L=104,R=292,W=340;const X=v=>L+(R-L)*v/mx;
  let y=8,h='';
  rows.forEach(r=>{const n=r.series.length;const top=y;
    h+=`<circle cx="8" cy="${y+n*11}" r="4.5" fill="${r.color}"/><text x="18" y="${y+n*11+4}" class="bl">${esc(r.label.length>15?r.label.slice(0,14)+'…':r.label)}</text>`;
    r.series.forEach((s,k)=>{const cy=y+11;if(s.tag)h+=`<text x="${L-8}" y="${cy+4}" class="bl" text-anchor="end">${s.tag}</text>`;
      if(s.vals.length){const q1=quant(s.vals,.25),q3=quant(s.vals,.75),md=quant(s.vals,.5),lo=Math.min(...s.vals),hi=Math.max(...s.vals);
        h+=`<line x1="${X(lo)}" x2="${X(hi)}" y1="${cy}" y2="${cy}" stroke="${r.color}" stroke-width="1.6"/><line x1="${X(lo)}" x2="${X(lo)}" y1="${cy-5}" y2="${cy+5}" stroke="${r.color}" stroke-width="1.6"/><line x1="${X(hi)}" x2="${X(hi)}" y1="${cy-5}" y2="${cy+5}" stroke="${r.color}" stroke-width="1.6"/>
        <rect x="${X(q1)}" y="${cy-7}" width="${Math.max(2,X(q3)-X(q1))}" height="14" rx="3" fill="${r.color}" fill-opacity="${s.tag==='♂'?.14:.3}" stroke="${r.color}" stroke-width="1.6"/><line x1="${X(md)}" x2="${X(md)}" y1="${cy-7}" y2="${cy+7}" stroke="${r.color}" stroke-width="2.6"/>
        ${s.vals.map((v,i)=>`<circle cx="${X(v)}" cy="${cy+((i%3)-1)*3}" r="2" class="bp"/>`).join('')}<text x="${W-2}" y="${cy+4}" class="bv" text-anchor="end">${fmtNum(md)}</text>`}
      else h+=`<text x="${L+4}" y="${cy+4}" class="bs">brak</text>`;
      y+=22});
    y+=8;if(rows.indexOf(r)<rows.length-1)h+=`<line x1="0" x2="${W}" y1="${y-4}" y2="${y-4}" class="bg"/>`});
  const ticks=[0,.25,.5,.75,1].map(t=>t*mx);
  h=ticks.map(t=>`<line x1="${X(t)}" x2="${X(t)}" y1="4" y2="${y}" class="bg"/>`).join('')+h+ticks.map(t=>`<text x="${X(t)}" y="${y+14}" class="bs" text-anchor="middle">${fmtNum(t)}</text>`).join('')+`<text x="${W-2}" y="${y+14}" class="bs" text-anchor="end">med.</text>`;
  return `<svg class="bchart" viewBox="0 0 ${W} ${y+20}" role="img" aria-label="Wykres pudełkowy">${h}</svg><div class="bcap">Pudełko: Q1–Q3, kreska: mediana, wąsy: min–maks, kropki: pojedyncze próbki${unit?' · '+unit:''}.</div>`;
}
function survSvg(e,counts){
  const groups=e.groups||[];const sx=sexes(e);const pts=[];
  groups.forEach(g=>sx.forEach(k=>{const start=num(k==='f'?g.nF:g.nM);if(!start)return;const line=[{d:0,v:100}];counts.forEach(c=>{const r=(c.rows||{})[g.id];const a=r&&num(r[k]);if(a!=null)line.push({d:daysBetween(e.start,c.at),v:a/start*100})});if(line.length>1)pts.push({g,k,line})}));
  if(!pts.length)return'';const dm=Math.max(7,...pts.flatMap(p=>p.line.map(q=>q.d)));
  const L=30,R=330,T=10,B=150;const X=d=>L+(R-L)*d/dm,Y=v=>B-(B-T)*v/100;
  let h=[0,25,50,75,100].map(v=>`<line x1="${L}" x2="${R}" y1="${Y(v)}" y2="${Y(v)}" class="bg"/><text x="${L-5}" y="${Y(v)+4}" class="bs" text-anchor="end">${v}</text>`).join('');
  h+=pts.map(p=>{const c=gcol(e,p.g);return `<polyline fill="none" stroke="${c}" stroke-width="2.2" ${p.k==='m'?'stroke-dasharray="5 4"':''} points="${p.line.map(q=>X(q.d)+','+Y(q.v)).join(' ')}"/>${p.line.map(q=>`<circle cx="${X(q.d)}" cy="${Y(q.v)}" r="2.6" fill="${c}"/>`).join('')}`}).join('');
  h+=`<text x="${L}" y="${B+16}" class="bs">0</text><text x="${R}" y="${B+16}" class="bs" text-anchor="end">dzień ${dm}</text>`;
  return `<svg class="bchart" viewBox="0 0 340 ${B+22}" role="img" aria-label="Przeżywalność w czasie">${h}</svg><div class="bcap">Przeżywalność (%) od startu${sx.length>1?' · linia ciągła ♀, przerywana ♂':''}.</div>`;
}
function stageBars(e,counts){
  const groups=e.groups||[];const st=BSTAGES.filter(([k])=>counts.some(c=>c.stage===k));if(!st.length)return'';
  const val=(g,k)=>{const c=counts.filter(c=>c.stage===k).pop();const r=c&&(c.rows||{})[g.id];if(!r)return null;const s=num(r.start)??num(g.eggs),n=num(r.n);return s&&n!=null?n/s*100:null};
  const L=30,R=336,T=10,B=140;const bw=(R-L)/st.length;const w=Math.min(16,(bw-10)/Math.max(1,groups.length));const Y=v=>B-(B-T)*Math.min(100,v)/100;
  let h=[0,50,100].map(v=>`<line x1="${L}" x2="${R}" y1="${Y(v)}" y2="${Y(v)}" class="bg"/><text x="${L-5}" y="${Y(v)+4}" class="bs" text-anchor="end">${v}</text>`).join('');
  st.forEach(([k,l],i)=>{const x0=L+i*bw+(bw-w*groups.length)/2;groups.forEach((g,j)=>{const v=val(g,k);if(v!=null)h+=`<rect x="${x0+j*w+1}" y="${Y(v)}" width="${w-2}" height="${B-Y(v)}" rx="2.5" fill="${gcol(e,g)}"/>`});h+=`<text x="${L+i*bw+bw/2}" y="${B+15}" class="bs" text-anchor="middle">${l}</text>`});
  return `<svg class="bchart" viewBox="0 0 340 ${B+22}" role="img" aria-label="Przeżywalność przez stadia">${h}</svg><div class="bcap">Odsetek osobników względem liczby na starcie (%), ostatnie liczenie w każdym stadium.</div>`;
}
function cycleBars(e,per){
  const S=setsOf(e.id).filter(x=>x.per===per);const rows=[];
  (e.groups||[]).forEach(g=>sexes(e).forEach(k=>{const m=['g1','s','g2m'].map(p=>{const z=S.filter(x=>x.groupId===g.id&&x.param===p);const s=stats(z.flatMap(x=>nums(x[k])));return s?s.m:null});if(m.some(v=>v!=null))rows.push({g,k,m})}));
  if(!rows.length)return'';
  return `<div class="cyc">${rows.map(r=>{const t=r.m.reduce((a,b)=>a+(b||0),0)||1;return `<div class="cycr"><span class="cl"><i style="background:${gcol(e,r.g)}"></i>${esc(r.g.name)} ${SEXS[r.k]}</span><span class="cb">${r.m.map((v,i)=>v?`<b class="c${i}" style="width:${v/t*100}%">${Math.round(v)}</b>`:'').join('')}</span></div>`}).join('')}<div class="bcap"><i class="lg c0"></i>G0/G1 <i class="lg c1"></i>S <i class="lg c2"></i>G2/M · średnie (%)</div></div>`;
}

/* ---------- widoki ---------- */
function bioView(){
  if(BS.temId){const t=Store.get(BS.temId);if(t)return temDetail(t);BS.temId=null}
  if(BS.expId){const e=Store.get(BS.expId);if(e)return expDetail(e);BS.expId=null}
  const sub=`<div class="bsub">${[['exp','Eksperymenty'],['med','Pożywka'],['tem','Protokoły TEM']].map(([k,l])=>`<button class="bch ${BS.sub===k?'on':''}" data-a="bSub" data-v="${k}">${l}</button>`).join('')}</div>`;
  if(BS.sub==='med')return sub+medView();
  if(BS.sub==='tem')return sub+temList();
  const all=Store.list('bexp');const run=all.filter(e=>e.status!=='done').sort((a,b)=>(a.start||'').localeCompare(b.start||''));const done=all.filter(e=>e.status==='done').sort((a,b)=>(b.start||'').localeCompare(a.start||''));
  return `${sub}
  <h3 class="bh">W toku</h3>
  ${run.length?run.map(expCard).join(''):`<div class="bempty">Nie masz trwających eksperymentów. Zacznij od przycisku poniżej – podasz linię muszek, grupy i plan pomiarów.</div>`}
  ${done.length?`<h3 class="bh">Zakończone</h3><div class="blist">${done.map(e=>`<div class="brow" data-a="bOpen" data-id="${e.id}"><span class="bbar"></span><div class="grow"><div class="t">${esc(e.name)}</div><div class="d">${esc(LINES[e.line]==='Inna'?e.lineOther||'inna linia':LINES[e.line]||'')} · ${fmtDs(e.start)} – ${fmtDs(expEnd(e))}</div></div></div>`).join('')}</div>`:''}
  <div style="height:90px"></div>
  <button class="fab bfab" data-a="bNew">${ICON.plus} Rozpocznij eksperyment</button>`;
}
function nextMilestone(e){if(!e.start)return'';const t=todayS();const out=[];
  if(isAdult(e))(e.periods||[]).forEach(p=>{const d=addDays(e.start.slice(0,10),BPER[p][1]);out.push([d,'Pomiar: '+BPER[p][0].toLowerCase()])});
  const end=expEnd(e);if(end)out.push([end,'Koniec']);const n=out.filter(x=>x[0]>=t).sort((a,b)=>a[0].localeCompare(b[0]))[0];if(!n)return'';
  const dd=daysBetween(t,n[0]);return `${n[1]}: ${dd===0?'dziś':dd===1?'jutro':'za '+dd+' dni'}`}
function expCard(e){const n=dayN(e);const end=expEnd(e);const tot=end&&e.start?Math.max(1,daysBetween(e.start,end)):null;const pr=tot&&n!=null?Math.min(100,Math.max(0,(n-1)/tot*100)):0;
  const tem=temsOf(e.id).filter(t=>(t.steps||[]).some(s=>!s.done))[0];const ms=nextMilestone(e);
  return `<div class="bcard" data-a="bOpen" data-id="${e.id}"><div class="bct"><div class="grow"><div class="bn">${esc(e.name)}</div><div class="bd">${esc(lineName(e))}, ${isAdult(e)?'dorosłe '+(e.sex==='f'?'♀':e.sex==='m'?'♂':'♀ i ♂'):'larwy'}${e.age?', '+esc(e.age):''}</div></div>${n!=null?`<div class="bday">${n>0?'dzień '+n:'start za '+(1-n)+' d'}</div>`:''}</div>
  ${tot?`<div class="bprog"><i style="width:${pr}%"></i></div><div class="bdates"><span>${fmtDs(e.start)}</span><span>${isAdult(e)&&(e.periods||[]).length?'okres: '+(e.periods||[]).map(p=>BPER[p][0].toLowerCase()).join(' + '):''}</span><span>${fmtDs(end)}</span></div>`:''}
  <div class="bgch">${(e.groups||[]).map(g=>`<span><i style="background:${gcol(e,g)}"></i>${esc(g.name)}</span>`).join('')}</div>
  ${ms||tem?`<div class="bbadges">${ms?`<span class="bb hot">${esc(ms)}</span>`:''}${tem?`<span class="bb">TEM: krok ${Math.min(tem.steps.length,tem.steps.filter(s=>s.done).length+1)} z ${tem.steps.length}</span>`:''}</div>`:''}</div>`}
const lineName=e=>e.line==='other'?(e.lineOther||'inna linia'):(LINES[e.line]||'');

function expDetail(e){
  const n=dayN(e);const adult=isAdult(e);const sx=sexes(e);
  const pers=adult?((e.periods||[]).length?e.periods:['week']):BSTAGES.map(s=>s[0]);
  let per=BS.per[e.id];if(!pers.includes(per)){const withData=pers.find(p=>setsOf(e.id).some(x=>x.per===p));per=withData||pers[0]}
  const S=setsOf(e.id).filter(x=>x.per===per);
  const rows=(e.groups||[]).map(g=>({label:g.name,color:gcol(e,g),series:sx.map(k=>({tag:SEXS[k],vals:S.filter(x=>x.groupId===g.id&&x.param===BS.param).flatMap(x=>nums(x[k]))}))}));
  const hasData=rows.some(r=>r.series.some(s=>s.vals.length));
  const C=countsOf(e.id);const tems=temsOf(e.id);
  const perL=p=>adult?BPER[p][0]+` (d${BPER[p][1]})`:BSTL[p];
  return `<button class="back" data-a="bBack">${ICON.back} Biologia</button>
  <div class="bhead"><div class="grow"><h2>${esc(e.name)}</h2><div class="bd">${esc(lineName(e))} · ${adult?'dorosłe, '+(sx.length>1?'♀ i ♂ osobno':SEXL[sx[0]]):'larwy (płeć bez znaczenia)'}</div></div>${e.status==='done'?'<span class="bday mute">zakończony</span>':n!=null?`<span class="bday">${n>0?'dzień '+n:'start za '+(1-n)+' d'}</span>`:''}</div>
  <div class="card"><dl class="bkv"><dt>Start</dt><dd>${e.start?fmtD(e.start)+(e.start.length>10?', '+e.start.slice(11,16):''):'–'}</dd><dt>Koniec</dt><dd>${expEnd(e)?fmtD(expEnd(e)):'–'}</dd>${e.temp?`<dt>Warunki</dt><dd>${esc(e.temp)}</dd>`:''}${e.age?`<dt>Wiek na starcie</dt><dd>${esc(e.age)}</dd>`:''}${(e.analyses||[]).length?`<dt>Analizy</dt><dd>${(e.analyses||[]).map(a=>esc((BANAL.find(x=>x[0]===a)||[0,a])[1])).join(', ')}</dd>`:''}</dl>
    <div class="bact"><button class="btn sm" data-a="bEdit" data-id="${e.id}">Edytuj</button><button class="btn sm" data-a="bDone" data-id="${e.id}">${e.status==='done'?'Wznów':'Zakończ'}</button></div></div>

  <div class="card"><div class="label">Grupy badawcze <span class="mute" style="font-weight:500">${(e.groups||[]).length}</span></div>
    ${(e.groups||[]).map(g=>`<div class="bgrp" style="--gc:${gcol(e,g)}"><div class="bgn">${esc(g.name)}</div><div class="bgd">${esc(groupDesc(g))}</div>
      ${compName(g)&&g.stock?`<div class="bgs">${esc(String(g.added||'?').replace('.',','))} mL roztworu ${esc(String(g.stock).replace('.',','))} ${esc(g.unit||'mg/mL')} → ${esc(String(g.medium||'?').replace('.',','))} mL pożywki${concStr(g)?` = <b>${concStr(g)}</b>`:''}</div>`:''}
      ${g.irr?`<div class="bgs">Naświetlanie: ${esc([g.wl&&g.wl+' nm',g.source,g.time,g.method].filter(Boolean).join(', ')||'tak')}</div>`:''}
      ${adult?(g.nF||g.nM?`<div class="bgs">Na starcie: ${sx.includes('f')?'♀ '+esc(g.nF||'–'):''} ${sx.includes('m')?'♂ '+esc(g.nM||'–'):''}</div>`:''):(g.eggs?`<div class="bgs">Wysiew: ${esc(g.eggs)}</div>`:'')}</div>`).join('')||'<div class="hint">Brak grup – dodaj je w edycji.</div>'}</div>

  <div class="card"><div class="label">Wyniki cytometrii <button class="btn sm primary" data-a="bAddSet" data-id="${e.id}">+ wyniki</button></div>
    <div class="bseg">${pers.map(p=>`<button class="${p===per?'on':''}" data-a="bPer" data-id="${e.id}" data-v="${p}">${adult?BPER[p][0]+` <small>d${BPER[p][1]}</small>`:BSTL[p]}</button>`).join('')}</div>
    <div class="bchips">${BPAR.map(([k,l])=>{const c=S.filter(x=>x.param===k).length;return `<button class="bch ${BS.param===k?'on':''}" data-a="bParam" data-v="${k}">${l}${c?` <small>${c}</small>`:''}</button>`}).join('')}</div>
    ${balgHtml(BS.param)}
    ${bprocHtml(BS.param)}
    ${hasData?`<div class="btt">${BPARL[BS.param]} · % komórek <span class="mute">${perL(per)}</span></div>${boxplotSvg(rows,'')}`:`<div class="bempty sm">Brak wyników: ${BPARL[BS.param]}, ${perL(per)}. Dodaj próbki – np. 5 próbek dla każdej grupy.</div>`}
    ${(e.groups||[]).map(g=>{const z=S.filter(x=>x.groupId===g.id&&x.param===BS.param);if(!z.length)return'';return z.map(x=>`<div class="bsetrow" data-a="bEditSet" data-id="${x.id}"><i style="background:${gcol(e,g)}"></i><div class="grow"><b>${esc(g.name)}</b> <span class="mute">${Math.max(...sx.map(k=>nums(x[k]).length))} prób.${x.at?' · '+fmtDs(x.at):''}${x.tissue?' · '+esc(x.tissue):''}</span></div><span class="bmv">${sx.map(k=>`${SEXS[k]} ${msd(x[k])}`).join('<br>')}</span></div>`).join('')}).join('')}
    ${cycleBars(e,per)?`<div class="btt" style="margin-top:14px">Cykl komórkowy <span class="mute">${perL(per)}</span></div>${cycleBars(e,per)}`:''}
  </div>

  <div class="card"><div class="label">${adult?'Przeżywalność':'Liczenie w stadiach'} <button class="btn sm" data-a="bCount" data-id="${e.id}">Policz teraz</button></div>
    ${adult?adultCounts(e,C):larvaCounts(e,C)}</div>

  <div class="card"><div class="label">Przygotowanie do TEM <button class="btn sm" data-a="bNewTem" data-id="${e.id}">+ protokół</button></div>
    ${tems.length?tems.map(temRow).join(''):'<div class="hint">Protokół z krokami (utrwalanie, skrawanie, kontrastowanie…), czasami i zdjęciami.</div>'}</div>

  <div class="card"><div class="label">Notatki</div>
    ${(e.notes||[]).slice().reverse().map((x,i)=>`<div class="bnote"><div class="bnt">${fmtDT(x.at)}<button class="bx" data-a="bDelNote" data-id="${e.id}" data-i="${(e.notes||[]).length-1-i}" aria-label="Usuń notatkę">×</button></div><div class="pre">${esc(x.text)}</div></div>`).join('')}
    <div class="bnadd"><textarea id="bNoteTxt" rows="2" placeholder="np. dzień 3 – kilka martwych samców w kontroli"></textarea><button class="btn sm primary" data-a="bAddNote" data-id="${e.id}">Dodaj</button></div>
    ${e.note?`<div class="sec"><h4>Opis</h4><div class="pre">${esc(e.note)}</div></div>`:''}</div>`;
}
function adultCounts(e,C){if(!C.length)return'<div class="hint">Wpisz, ile osobników żyje w każdej grupie – przeżywalność policzy się względem liczby na starcie.</div>';
  const last=C[C.length-1];const sx=sexes(e);
  return `<div class="bsm mute">Ostatnie liczenie: ${fmtDT(last.at)} · dzień ${daysBetween(e.start,last.at)+1}</div><div class="tablewrap"><table><thead><tr><th>Grupa</th>${sx.map(k=>`<th class="n">${SEXS[k]} żywe</th><th class="n">%</th>`).join('')}</tr></thead><tbody>
  ${(e.groups||[]).map(g=>{const r=(last.rows||{})[g.id]||{};return `<tr><td><i class="dot" style="background:${gcol(e,g)}"></i>${esc(g.name)}</td>${sx.map(k=>{const s=num(k==='f'?g.nF:g.nM),a=num(r[k]);return `<td class="n">${a??'–'}${s?`<span class="mute">/${s}</span>`:''}</td><td class="n"><b>${a!=null&&s?Math.round(a/s*100)+'%':'–'}</b></td>`}).join('')}</tr>`}).join('')}</tbody></table></div>
  ${survSvg(e,C)}<div class="blinks">${C.map(c=>`<button class="bch" data-a="bEditCount" data-id="${c.id}">${fmtDs(c.at)}</button>`).join('')}</div>`}
function larvaCounts(e,C){
  const st=BS.cstage;const cs=C.filter(c=>c.stage===st);const last=cs[cs.length-1];
  return `<div class="bseg sm">${BSTAGES.map(([k,l])=>`<button class="${k===st?'on':''}" data-a="bCStage" data-v="${k}">${l}${C.some(c=>c.stage===k)?' •':''}</button>`).join('')}</div>

const CROLE={'':'Wszystkie',sub:'Substraty',rea:'Reagenty',cat:'Katalizatory',solv:'Rozpuszczalniki',own:'Twoje'};
Object.assign(state,{cq:'',crole:''});
function cmpList(){
  const q=state.cq.trim().toLowerCase();let L=[...reagLib().values()];
  if(state.crole==='own')L=L.filter(x=>x.own||x.fromSyn);else if(state.crole)L=L.filter(x=>x.role===state.crole);
  if(q)L=L.filter(x=>[x.name,x.formula,x.cas,x.info,x.smiles].join(' ').toLowerCase().includes(q));
  L.sort((a,b)=>a.name.localeCompare(b.name,'pl'));
  if(!L.length)return `<div class="card empty">${q?'Nic nie znaleziono. Dodaj własny związek przyciskiem „+ Dodaj”.':'Brak związków w tej grupie.'}</div>`;
  return `<div class="card ctable"><div class="crow ch"><span>Związek</span><span class="n">M g/mol</span><span class="n">d g/ml</span></div>${L.map(x=>`<div class="crow" data-a="openCmp" data-k="${esc(x.name.toLowerCase())}"><div class="cn"><b>${esc(x.name)}</b><small>${esc([fsub(x.formula),x.info,ROLES[x.role]].filter(Boolean).join(' · '))}${x.own?' · <span style="color:var(--acc)">twój</span>':''}</small></div><span class="n mono">${esc(x.M||'–')}</span><span class="n mono mute">${esc(x.d||(x.c?x.c+' M':'–'))}</span></div>`).join('')}</div>`;
}

  <div class="chips">${Object.entries(CROLE).map(([k,l])=>`<button class="chipbtn ${state.crole===k?'on':''}" data-a="crole" data-v="${k}">${l}</button>`).join('')}</div>

async function detectBands(src,m,dir,res){res=res||0.012;
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});

  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const cx=cv.getContext('2d');cx.drawImage(img,0,0,W,H);
  const px=cx.getImageData(0,0,W,H).data;const Lum=new Float32Array(W*H);for(let i=0;i<W*H;i++)Lum[i]=0.299*px[i*4]+0.587*px[i*4+1]+0.114*px[i*4+2];

  const axY=(m.ax[0].y+m.ax[1].y)/2;const y1=Math.max(5,Math.round((axY-0.012)*H)),y0=Math.round((m.top!=null?m.top:0.02)*H);
  const vals=[];for(let y=y0;y<y1;y+=2)for(let x=xa;x<xb;x+=2)vals.push(Lum[y*W+x]);vals.sort((a,b)=>a-b);

async function detectEPR(src,m){

  const span=Math.abs(m.ax[1].x-m.ax[0].x)||1;

    for(let k=i+1;k<all.length;k++){if(used.has(k))continue;if(all[k].x-p.x>span*0.08)break;if(all[k].s!==p.s){j=k;break}}

function tlcHint(row){
  const spots=[];row.querySelectorAll('.thumb').forEach(t=>{let mk=null;try{mk=JSON.parse(t.dataset.marks||'null')}catch(e){}if(mk)(mk.spots||[]).forEach((sp,i)=>{const rf=rfOf(mk,sp);if(rf!=null)spots.push({l:(typeof spotName==='function'?spotName(mk,sp,i):(sp.label||'')).replace(/^plamka \d+$/,'').trim(),rf})})});
  if(!spots.length){const s=(row.querySelector('[data-f=rf]')||{}).value||'';s.split(';').forEach(p=>{const mm=p.trim().match(/^(.*?)\s*([01][.,]\d+)/);if(mm)spots.push({l:mm[1].trim(),rf:num(mm[2])})})}
  if(!spots.length)return 'Zaznacz plamki na zdjęciu (nazwij je np. S i P) albo wpisz Rf – wtedy podpowiem wniosek.';
  const find=re=>spots.find(x=>re.test(x.l));const S=find(/^(s|sm|sub)/i);const P=find(/^(p|prod)/i)||spots.find(x=>/^(r|mies|rm)/i.test(x.l)&&(!S||Math.abs(x.rf-S.rf)>0.03));const out=[];
  if(P&&S){const d=Math.abs(P.rf-S.rf);out.push(d<0.1?`Słaby rozdział P/S (ΔRf ${fmtRf(d)}) – spróbuj innego układu eluentów (np. toluen/AcOEt, DCM/MeOH).`:`Dobry rozdział P/S (ΔRf ${fmtRf(d)}).`)}
  if(P){out.push(P.rf>0.5?`Rf produktu ${fmtRf(P.rf)} – do kolumny weź słabszy eluent (cel: Rf ≈ 0,25–0,35).`:P.rf<0.15?`Rf produktu ${fmtRf(P.rf)} – eluent za słaby, zwiększ udział składnika polarnego.`:`Rf produktu ${fmtRf(P.rf)} – dobry do kolumny w tym eluencie.`)}
  if(S)out.push('Jeśli w ścieżce mieszaniny (R) nie ma już plamki S – substrat przereagował; słaba plamka S = reakcja jeszcze trwa.');
  const others=spots.filter(x=>x!==P&&x!==S);if(others.length)out.push(`Inne plamki: ${others.map(x=>(x.l||'?')+' '+fmtRf(x.rf)).join(', ')} – produkty uboczne lub zanieczyszczenia.`);
  if(!P&&!S)out.push('Nazwij plamki S (substrat) i P (produkt), żeby dostać pełniejszą podpowiedź.');
  return out.join(' ');
}

const INT_W={s:100,m:60,w:28},INT_L={s:'silne',m:'średnie',w:'słabe'};
const dotN=v=>String(v).replace(',','.');
const shortLab=l=>String(l||'').replace(/^g = [^·]*·\s*/,'').replace(/\s+–\s.*$/,'').replace(/\s*\(.*$/,'').replace(/\s+\/\s.*$/,'').trim();
function sigCols(t){
  if(t==='ir'||t==='raman')return{cols:['cm⁻¹','int.','przypisanie'],tpl:'68px 58px 1fr'};
  if(t==='h'||t==='c'||t==='nmrx')return{cols:['δ ppm','przypisanie'],tpl:'72px 1fr'};
  if(t==='uv'||t==='fl')return{cols:['λ nm','przypisanie'],tpl:'60px 1fr'};
  if(t==='ms')return{cols:['m/z','jon / przypisanie'],tpl:'84px 1fr'};
  if(t==='epr')return{cols:['B mT','g','ΔBpp','przypisanie'],tpl:'64px 62px 50px 1fr'};
  return{cols:['wartość','opis'],tpl:'72px 1fr'};
}
const sortBands=m=>{const t=m.tech;return(m.bands||[]).map((b,i)=>({...b,n:i+1})).sort((a,b)=>t==='uv'||t==='fl'||t==='ms'||t==='epr'?a.v-b.v:b.v-a.v)};
const eprG=(m,b)=>b.v?71.4477*(num(m.nu)||9.5)/b.v:null;
function sigRows(m,opt={}){const t=m.tech;const{tpl}=sigCols(t);const vis=opt.vis;
  return sortBands(m).map(b=>{const dim=vis&&!(b.x>=vis[0]&&b.x<=vis[1]);const lab=esc(t==='epr'?shortLab(b.label)||b.label:b.label||'—');
    const num0=`<span class="sv">${opt.nums?`<i class="sn">${b.n}</i>`:''}${esc(bandFmt(t,b.v))}</span>`;let mid='';
    if(t==='ir'||t==='raman'){const k=['s','m','w'].includes(b.int)?b.int:'';mid=`<span class="si">${k?`<span class="bar"><span style="width:${INT_W[k]}%"></span></span><small>${INT_L[k]}</small>`:'<small>—</small>'}</span>`}
    if(t==='epr'){const g=eprG(m,b);const dB=((b.int||'').match(/[\d]+[,.]?\d*/)||[''])[0];mid=`<span class="sv">${g?g.toFixed(4).replace('.',','):'–'}</span><span class="sv mute">${esc(dB||'–')}</span>`}
    return `<div class="srow${dim?' dim':''}" style="grid-template-columns:${tpl}" data-bx="${b.x}" data-by="${b.y}">${num0}${mid}<span class="sl">${lab}</span></div>`}).join('')}
function sigHead(m){const{cols,tpl}=sigCols(m.tech);return `<div class="srow sh" style="grid-template-columns:${tpl}">${cols.map(c=>`<span>${c}</span>`).join('')}</div>`}
function sigChips(m){const t=m.tech;const B=m.bands||[];if(!B.length)return'';const out=[];
  if(t==='ir'||t==='raman'||t==='uv'||t==='fl'){[...new Set(B.filter(b=>!/blisko zakresu|rozpuszczalnik/.test(b.label||'')).map(b=>shortLab(b.label)).filter(Boolean))].slice(0,8).forEach(l=>out.push([l,true]))}
  if(t==='ir'){const has=(lo,hi)=>B.some(b=>b.v>=lo&&b.v<=hi);if(!has(3200,3600))out.push(['brak O–H / N–H',false]);if(!has(1650,1830))out.push(['brak C=O',false]);if(!has(2100,2270))out.push(['brak C≡C / C≡N / N₃',false])}
  if(t==='h'||t==='c'){const solv=B.filter(b=>/rozpuszczalnik/.test(b.label||'')).length;out.push([`${B.length-solv} sygnałów`,true]);if(solv)out.push([`${solv} od rozpuszczalnika`,false])}
  if(t==='epr'&&B.length>1){const S=sortBands(m);const d=[];for(let i=1;i<S.length;i++)d.push(S[i].v-S[i-1].v);const a=d.reduce((p,q)=>p+q,0)/d.length;const ok=d.every(x=>Math.abs(x-a)<a*0.15);
    const mid=(S[0].v+S[S.length-1].v)/2;out.push([`g (środek) ${(71.4477*(num(m.nu)||9.5)/mid).toFixed(4).replace('.',',')}`,true]);out.push([`${ok?'równe odstępy':'odstępy'} a ≈ ${bandFmt('epr',a)} mT`,true]);if(ok&&S.length===3)out.push(['tryplet 1:1:1 → ¹⁴N (nitroksyl?)',true]);if(ok&&S.length===2)out.push(['dublet → jedno jądro I = ½',true])}
  if(!out.length)return'';
  return `<div class="schips"><span class="slab">Co widać na widmie</span><div>${out.map(([l,ok])=>`<span class="sc${ok?'':' no'}">${ok?'✓':'→'} ${esc(l)}</span>`).join('')}</div></div>`}
function pubFor(m,a){const t=m.tech;const v=(a&&a.v)||{};const S=sortBands(m).filter(b=>b.v!=null&&!/rozpuszczalnik/.test(b.label||''));if(!S.length)return'';const f=b=>dotN(bandFmt(t,b.v));
  if(t==='ir')return `IR (${v.mode||'ATR'}) ν ${S.map(b=>f(b)+(b.int?` (${b.int})`:'')).join(', ')} cm⁻¹.`;
  if(t==='raman')return `Raman${v.laser?` (λexc = ${dotN(v.laser)} nm)`:''} ν ${S.map(b=>f(b)+(b.int?` (${b.int})`:'')).join(', ')} cm⁻¹.`;
  if(t==='h'||t==='c'){const nuc=t==='h'?'¹H':'¹³C';return `${nuc} NMR (${[v.freq&&dotN(v.freq)+' MHz',v.solv].filter(Boolean).join(', ')||'—'}) δ ${S.map(f).join(', ')}.`}
  if(t==='uv')return `UV-Vis${v.solv?` (${v.solv})`:''} λmax ${S.map(f).join(', ')} nm.`;
  if(t==='fl')return `Fluorescencja${v.lex?` (λex = ${dotN(v.lex)} nm)`:''} λem ${S.map(f).join(', ')} nm.`;
  if(t==='ms')return `MS (${v.ion||'ESI'}) m/z ${S.map(b=>f(b)+(b.label&&/^\[|M/.test(b.label)?` (${b.label.split(' (')[0]})`:'')).join(', ')}.`;
  if(t==='epr'){const nu=num(m.nu)||9.5;return `EPR (${(v.band||'X').split(' ')[0]}-band, ν = ${nu.toFixed(2)} GHz${v.temp?', '+dotN(v.temp)+' K':''}): ${S.map(b=>{const g=eprG(m,b);const dB=((b.int||'').match(/[\d]+[,.]?\d*/)||[''])[0];return `g = ${g?g.toFixed(4):'–'}${dB?`, ΔBpp = ${dotN(dB)} mT`:''}`}).join('; ')}.`}
  return S.map(f).join(', ')}
function bandsOf(a){if(!a||!a.marks)return null;const L=Object.values(a.marks).filter(m=>m&&m.bands&&m.bands.length);if(!L.length)return null;const m={...L[0],bands:L.flatMap(x=>x.bands)};return m}
function sigBlock(a){const m=bandsOf(a);if(!m)return'';m.tech=a.tech;const p=pubFor(m,a);
  return `<div class="sigs">${sigHead(m)}${sigRows(m)}</div>${sigChips(m)}${p?`<div class="pub"><div class="ph"><span class="slab">Zapis do publikacji</span><button type="button" class="btn sm" data-a="copyPub" data-t="${esc(p)}">Kopiuj</button></div><div class="pt">${esc(p)}</div></div>`:''}`}

  studyNext:async b=>{const s=Store.get(b.dataset.id);if(!s)return;const n=(s.status||'todo')==='todo'?'ongoing':'done';await Store.save({...s,status:n,start:s.start||(n==='ongoing'?today():''),progress:n==='done'?'100':s.progress});toast(n==='done'?'Badanie zakończone':'Badanie rozpoczęte')},
  addNote:b=>{const s=Store.get(b.dataset.id);s&&noteForm(s)},
  editNote:b=>{const s=Store.get(b.dataset.id);const n=s&&(s.notes||[]).find(x=>x.id===b.dataset.nid);n&&noteForm(s,n)}
};
window.__planerRender=()=>render();
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.closest('#sheet')||b.closest('#sheet-root')||b.closest('.chem'))return;const f=A[b.dataset.a];if(f){e.preventDefault();e.stopPropagation();f(b,e)}});
window.addEventListener('hashchange',()=>{readHash();render()});
setInterval(()=>{const busy=$('#sheet').classList.contains('open')||(typeof Chem!=='undefined'&&Chem.sheetOpen())||document.querySelector('.rfx')||(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));if(!busy&&(state.tab==='kalendarz'||(state.tab==='badania'&&state.resPart==='chem')))render()},30000);
/* ===== wersja na telefon (PWA): dane w pamięci telefonu ===== */
const IS_PWA=true;
const IDB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('planer',1);r.onupgradeneeded=()=>r.result.createObjectStore('items',{keyPath:'id'});r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  tx(mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction('items',mode);const rq=fn(t.objectStore('items'));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error)})},
  all(){return this.tx('readonly',s=>s.getAll())},put(o){return this.tx('readwrite',s=>s.put(o))},del(id){return this.tx('readwrite',s=>s.delete(id))}};
Store.save=async function(o){o=JSON.parse(JSON.stringify(o));if(!o.id)o.id=newId();o.updated=Date.now();if(!o.created)o.created=o.updated;this.items.set(o.id,o);try{await IDB.put(o)}catch(e){toast('Nie zapisano – brak miejsca?')}render();return o};
Store.remove=async function(id){this.items.delete(id);try{await IDB.del(id)}catch(e){}render()};
const lsG=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsS=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
async function initPWA(){try{await IDB.open();Store.items=new Map((await IDB.all()).map(x=>[x.id,x]))}catch(e){Store.load()}Store.mode='local';render();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
function backupNag(){const last=+lsG('planer-backup')||0;if(Store.items.size<5)return'';const days=last?Math.floor((Date.now()-last)/864e5):null;if(days!=null&&days<7)return'';return `<div class="banner" data-a="settings">${days==null?'Nie masz jeszcze kopii zapasowej.':'Ostatnia kopia: '+days+' dni temu.'} Dane są tylko w tym telefonie – dotknij, żeby zrobić kopię.</div>`}
const backupBlob=()=>new Blob([JSON.stringify({app:'planer',version:1,exported:new Date().toISOString(),items:[...Store.items.values()]})],{type:'application/json'});
function settingsSheet(){
  const pref=lsG('planer-theme')||'light';const last=+lsG('planer-backup')||0;
  const canShare=!!(navigator.canShare&&window.File&&navigator.canShare({files:[new File(['x'],'a.json',{type:'application/json'})]}));
  sheet({title:'Ustawienia',body:`
    <label class="f">Wygląd</label>${opts('theme',[['light','Jasny'],['dark','Ciemny'],['auto','Jak w telefonie']],pref)}
    <label class="f">Kopia zapasowa</label><div class="hint" style="margin-top:4px">Dane są tylko w tym telefonie (${Store.items.size} wpisów). Ostatnia kopia: ${last?fmtDay(ymd(new Date(last))):'nigdy'}.</div>
    <div class="actions" style="margin-top:10px">${canShare?'<button type="button" class="btn primary" data-s="share">Wyślij kopię (Dysk, mail)</button>':''}<button type="button" class="btn" data-s="download">Zapisz plik kopii</button></div>
    <label class="f">Przywróć z pliku<input type="file" id="impFile" accept="application/json,.json"></label>
    <label class="f">…albo wklej kopię<textarea id="imp" rows="3"></textarea></label><div class="actions" style="margin-top:8px"><button type="button" class="btn sm" data-s="import">Przywróć</button></div>`,
    onClick:async s=>{
      if(s==='download'){const u=URL.createObjectURL(backupBlob());const a=document.createElement('a');a.href=u;a.download=`planer-kopia-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);lsS('planer-backup',Date.now());toast('Zapisano plik w Pobranych')}
      if(s==='share'){try{await navigator.share({files:[new File([backupBlob()],`planer-kopia-${today()}.json`,{type:'application/json'})],title:'Kopia – Planer'});lsS('planer-backup',Date.now())}catch(e){if(e&&e.name!=='AbortError')toast('Nie udało się wysłać')}}
      if(s==='import')importText($('#imp').value)}});
  $('#sheet input[name=theme]').addEventListener('change',e=>setTheme(e.target.value));
  $('#impFile').addEventListener('change',async e=>{const f=e.target.files[0];if(f)importText(await f.text())});
}

readHash();render();initPWA();
</script>
</body>
</html>
