<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planer">
<script>try{var t=localStorage.getItem("planer-theme")||"light";if(t==="auto")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="light"}</script>
<title>Planer</title>
<script src="smiles-drawer.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff;--surface:#ffffff;--sunk:#f2f2f4;--ink:#1d2340;--soft:#6b7290;--faint:#a3a8bf;--line:#e3e6f0;
  --uni:#5b5bd6;--work:#0e9f8e;--task:#ee8a3c;--res:#d6457f;--danger:#d93b4b;
  --uni-t:#ebebfc;--work-t:#e1f5f2;--task-t:#fdf0e4;--res-t:#fbe6ef;
  --r-lg:22px;--r-md:16px;--r-sm:11px;
  --shadow:0 1px 2px rgba(29,35,64,.05),0 8px 24px -12px rgba(29,35,64,.18);
}
html[data-theme=dark]{
  --paper:#000000;--surface:#111111;--sunk:#1c1c1e;--ink:#e9ebf5;--soft:#9aa0bd;--faint:#646a88;--line:#2b2f44;
  --uni:#8b8bf5;--work:#2fc6b2;--task:#f5a462;--res:#f07aa8;--danger:#ff6b78;
  --uni-t:#262a52;--work-t:#183a37;--task-t:#3d2c1e;--res-t:#3c2232;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Figtree',system-ui,sans-serif;font-size:16px;line-height:1.45}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(84px + env(safe-area-inset-bottom));min-height:100vh}
button{font-family:inherit;color:inherit}
main{max-width:720px;margin:0 auto;padding:6px 18px 40px}
:focus-visible{outline:2px solid var(--uni);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* header */
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 0 10px}
.hdr .pre{color:var(--soft);font-weight:500;font-size:15px}
.big{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:34px;letter-spacing:-.02em;line-height:1.02;margin:2px 0 0}
.round{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.round svg{width:20px;height:20px}
h2.sec{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:20px;letter-spacing:-.01em;margin:26px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h2.sec small{font-family:'Figtree',system-ui,sans-serif;font-weight:500;font-size:14px;color:var(--soft)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:space-around}
.tabs button{flex:1;max-width:120px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--faint);cursor:pointer}
.tabs svg{width:24px;height:24px}
.tabs button .ic{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
.tabs button.on{color:var(--ink)}
.tabs button.on .ic{background:var(--sunk)}
.tabs button.on[data-v=kalendarz] .ic{background:var(--uni-t);color:var(--uni)}
.tabs button.on[data-v=uczelnia] .ic{background:var(--uni-t);color:var(--uni)}
.tabs button.on[data-v=praca] .ic{background:var(--work-t);color:var(--work)}
.tabs button.on[data-v=zadania] .ic{background:var(--task-t);color:var(--task)}
.tabs button.on[data-v=badania] .ic{background:var(--res-t);color:var(--res)}

/* month calendar */
.month{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:10px 10px 6px}
.mgrid .wd{padding:0 0 4px!important}
.dhead{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:10px 12px}
.dhead .lbl{flex:1;text-align:center}
.dhead .lbl b{display:block;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:19px;font-weight:700}
.dhead .lbl small{color:var(--soft);font-size:13.5px}
.allday{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.timeline{position:relative;margin-top:12px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:6px 10px 6px 0}
.hr{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.hr span{position:absolute;left:8px;top:-9px;font-size:12px;color:var(--faint);background:var(--surface);padding:0 4px;font-variant-numeric:tabular-nums}
.blk{position:absolute;border-radius:12px;padding:6px 9px;overflow:hidden;background:var(--tint);border-left:4px solid var(--c);cursor:pointer}
.blk .t{font-weight:700;font-size:14px;line-height:1.2}
.blk .d{font-size:12px;color:var(--soft)}
.blk.cancel{opacity:.5}.blk.cancel .t{text-decoration:line-through}
.nowline{position:absolute;left:44px;right:0;border-top:2px solid var(--danger);z-index:2}
.nowline::before{content:'';position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--danger)}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px}
.mhead b{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:18px;font-weight:700;text-transform:capitalize}
.mhead .nav{display:flex;gap:6px}
.chev{width:34px;height:34px;border-radius:50%;border:0;background:var(--sunk);display:grid;place-items:center;cursor:pointer}
.chev svg{width:16px;height:16px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.mgrid .wd{font-size:12px;font-weight:600;color:var(--faint);padding:2px 0 6px}
.day{position:relative;border:0;background:none;padding:2px 0 9px;border-radius:14px;cursor:pointer;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.day.out{color:var(--faint);font-weight:500}
.day.today span.n{color:var(--uni)}
.day span.n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:14px}
.day.sel span.n{background:var(--ink);color:var(--paper)}
.dots{position:absolute;left:0;right:0;bottom:3px;display:flex;justify-content:center;gap:3px}
.dots i{width:5px;height:5px;border-radius:50%}

/* agenda */
.agenda{display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:stretch;cursor:pointer}
.ev .tm{text-align:right;font-variant-numeric:tabular-nums;padding-top:12px}
.ev .tm b{display:block;font-weight:700;font-size:15px}
.ev .tm span{font-size:13px;color:var(--soft)}
.ev .bx{background:var(--tint);border-radius:var(--r-md);padding:11px 14px;position:relative;border-left:4px solid var(--c)}
.ev .bx .t{font-weight:700;font-size:16px;line-height:1.25}
.ev .bx .d{font-size:13.5px;color:var(--soft);margin-top:2px}
.ev .bx .k{font-size:12px;font-weight:700;color:var(--c);margin-bottom:2px}
.ev.cancel .bx{opacity:.5}
.ev.cancel .bx .t{text-decoration:line-through}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-md);padding:18px;color:var(--soft);font-size:15px;text-align:center}

/* grouped list */
.group{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);cursor:pointer;min-height:58px}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;font-size:16px;line-height:1.3}
.row .d{font-size:13.5px;color:var(--soft);margin-top:1px}
.row .side{text-align:right;font-size:13.5px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.sw{width:10px;height:38px;border-radius:5px;flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%}
.pill.late{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

/* week nav */
.wnav{display:flex;align-items:center;gap:10px;margin:6px 0 2px}
.wnav .lbl{flex:1;text-align:center;font-weight:700}
.wnav .lbl small{display:block;font-weight:500;color:var(--soft);font-size:13px}
.dayh{font-weight:700;font-size:15px;margin:20px 0 8px;display:flex;align-items:baseline;gap:8px}
.dayh span{color:var(--soft);font-weight:500;font-size:14px}
.dayh.today{color:var(--uni)}

/* segmented & chips */
.seg{display:flex;background:var(--sunk);border-radius:14px;padding:4px;gap:4px;margin:4px 0 6px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:10px;font-weight:600;font-size:14.5px;color:var(--soft);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;color:var(--soft)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stat{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);padding:14px 16px}
.stat b{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:28px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1.1}
.stat span{font-size:13.5px;color:var(--soft)}

/* tasks */
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--faint);flex:none;display:grid;place-items:center;background:none;cursor:pointer;padding:0}
.check.on{background:var(--task);border-color:var(--task);color:#fff}
.check svg{width:14px;height:14px}
.row.done .t{text-decoration:line-through;color:var(--soft)}
.prio{width:4px;align-self:stretch;border-radius:2px;margin:-4px 0}
.prio.p1{background:var(--danger)}.prio.p2{background:var(--task)}.prio.p3{background:var(--line)}
.ghdr{font-size:13.5px;font-weight:700;color:var(--soft);margin:18px 4px 8px;display:flex;align-items:center;gap:8px}
.ghdr i{width:9px;height:9px;border-radius:50%}

/* detail */
.back{border:0;background:none;display:inline-flex;align-items:center;gap:4px;color:var(--soft);font-weight:600;font-size:15px;padding:12px 0 4px;cursor:pointer}
.back svg{width:18px;height:18px}
.dtitle{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1.1;margin:6px 0 12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 18px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px 18px;font-size:15px}
.kv dt{color:var(--soft)}
.kv dd{margin:0;font-weight:600}
.prose{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px 18px;white-space:pre-wrap;font-size:15.5px;line-height:1.6}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--res)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;font-size:15px;cursor:pointer;background:var(--sunk);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.danger{background:none;color:var(--danger)}
.btn.sm{padding:9px 13px;font-size:14px;border-radius:12px}
.note{border-left:3px solid var(--res);padding:4px 0 4px 12px;margin:12px 0}
.note small{color:var(--soft);font-size:12.5px;font-weight:600}

/* fab */
.fab{position:fixed;right:18px;bottom:calc(92px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;border:0;background:var(--ink);color:var(--paper);display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(29,35,64,.45);cursor:pointer;z-index:7}
.fab svg{width:26px;height:26px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:20;pointer-events:none}
#sheet.open{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(15,18,35,.42);opacity:0;transition:opacity .22s}
#sheet.open .scrim{opacity:1}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;max-height:92vh;background:var(--surface);border-radius:26px 26px 0 0;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#sheet.open .panel{transform:none}
.ph{padding:10px 20px 6px;text-align:center}
.ph i{display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.ph h3{margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:21px;font-weight:700}
.pb{overflow-y:auto;padding:4px 20px 20px;flex:1}
.pf{display:flex;gap:10px;padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.pf .sp{flex:1}
label.f{display:block;font-size:13.5px;font-weight:600;color:var(--soft);margin:14px 0 0}
input,select,textarea{width:100%;margin-top:6px;background:var(--paper);border:1.5px solid var(--line);color:var(--ink);border-radius:13px;padding:12px 13px;font:500 16px 'Figtree',sans-serif;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--uni)}
input.err{border-color:var(--danger)}
textarea{resize:vertical;line-height:1.5}
html[data-theme=dark] input,html[data-theme=dark] select,html[data-theme=dark] textarea{color-scheme:dark}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--soft);margin-top:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 13px;font-weight:600;font-size:14.5px;cursor:pointer;color:var(--ink)}
.opt.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.swatches{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.swatch{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.swatch.on{border-color:var(--ink)}
.dlist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.dlist .r{display:flex;gap:8px}
.dlist .r input{margin:0}
.x{border:0;background:var(--sunk);border-radius:12px;width:46px;flex:none;font-size:20px;cursor:pointer;color:var(--danger)}
.addline{margin-top:8px;border:1.5px dashed var(--line);background:none;border-radius:12px;padding:10px;width:100%;font-weight:600;color:var(--uni);cursor:pointer}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.quick button{border:0;border-radius:18px;padding:18px 14px;text-align:left;font-weight:700;font-size:16px;cursor:pointer;background:var(--tint);color:var(--c)}
.quick button small{display:block;font-weight:500;font-size:13px;color:var(--soft);margin-top:3px}
#toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:14px;font-weight:600;font-size:14.5px;opacity:0;transition:.2s;z-index:30;pointer-events:none;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.banner{background:var(--task-t);color:var(--ink);border-radius:var(--r-md);padding:12px 14px;font-size:14px;margin:8px 0;cursor:pointer}
.chem .mono{font-family:'Figtree',monospace}
.chem .mute{color:var(--mute)}
.chem h1{font-size:24px;margin:8px 0 2px;letter-spacing:-.01em}
.chem h2{font-size:20px;margin:4px 0}
.chem .sub{color:var(--mute);font-size:13px;margin-bottom:8px;line-height:1.45}
.chem .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.chem .label{font:600 11px 'Figtree',system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chem .item{display:flex;align-items:center;gap:12px;padding:10px 2px;border-top:1px solid var(--line);cursor:pointer}
.chem .item:first-of-type{border-top:0}
.chem .item .grow{flex:1;min-width:0}
.chem .item .t{font-weight:600}
.chem .item .d{color:var(--mute);font-size:13px}
.chem .empty{color:var(--mute);font-size:14px;padding:6px 0;line-height:1.5}
.chem .btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:11px;padding:10px 14px;font:600 14px 'Figtree',system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.chem .btn.primary{background:var(--acc);border-color:var(--acc);color:#1a1405}
.chem .btn.ghost{background:transparent}
.chem .btn.bad{color:var(--bad)}
.chem .btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.chem .btn:disabled{opacity:.4}
.chem .row-btns{display:flex;gap:8px;flex-wrap:wrap}
.chem .chip{display:inline-flex;align-items:center;gap:4px;font:500 12px 'Figtree',system-ui,sans-serif;padding:3px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--text);margin:0 4px 4px 0;white-space:nowrap}
.chem .chip.acc{border-color:rgba(232,196,90,.55);color:var(--acc)}
.chem .chip.sun{border-color:rgba(255,213,92,.55);color:#ffd55c}
.chem .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;margin:6px 0 10px}
.chem .seg button{flex:1;background:none;border:0;color:var(--mute);padding:7px;border-radius:9px;font:600 13px 'Figtree',system-ui,sans-serif;cursor:pointer}
.chem .seg button.on{background:var(--panel2);color:var(--text)}
.chem .back{background:none;border:0;color:var(--mute);font:500 14px 'Figtree',system-ui,sans-serif;padding:6px 0;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.chem .kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14px}
.chem .kv dt{color:var(--mute)}
.chem .kv dd{margin:0;font-weight:500}
.chem .pre{white-space:pre-wrap;line-height:1.55;font-size:14.5px}
.chem .sec h4{margin:14px 0 6px;font:600 11px 'Figtree',system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.chem .tablewrap{overflow-x:auto;margin:0 -4px;-webkit-overflow-scrolling:touch}
.chem table{border-collapse:collapse;width:100%;font-size:13px}
.chem th,.chem td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.chem th{font:600 10.5px 'Figtree',system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.chem td.n,.chem th.n{font-family:'Figtree',system-ui,sans-serif;text-align:right}
.chem tr.click{cursor:pointer}
.chem .legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;margin-top:6px}
.chem .legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}

<script>
/* ===== pomocnicze ===== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId=()=>'k'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const parseD=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const mondayOf=s=>{const d=parseD(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
const DOW=['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];
const DOWS=['Nd','Pn','Wt','Śr','Cz','Pt','Sb'];
const MONN=['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'];
const MONG=['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
const MONS=['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];
const fmtLong=s=>{const d=parseD(s);return `${d.getDate()} ${MONG[d.getMonth()]}`};
const fmtShort=s=>{const d=parseD(s);return `${d.getDate()} ${MONS[d.getMonth()]}`};
const fmtDay=s=>{const d=parseD(s);return `${DOWS[d.getDay()]}, ${d.getDate()} ${MONS[d.getMonth()]}`};
const toMin=t=>{if(!t)return 0;const [h,m]=t.split(':').map(Number);return h*60+(m||0)};
const hrs=(a,b)=>{let m=toMin(b)-toMin(a);if(m<=0)m+=1440;return m/60};
const fmtH=h=>{const r=Math.round(h*10)/10;return String(r).replace('.',',')+' h'};
const num=v=>{if(v===''||v==null)return null;const x=parseFloat(String(v).replace(',','.'));return isFinite(x)?x:null};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}
function relDue(due){const d=diffDays(today(),due);if(d===0)return'dziś';if(d===1)return'jutro';if(d===-1)return'wczoraj';if(d>1&&d<7)return'za '+d+' dni';if(d<0)return(-d)+' dni po terminie';return fmtShort(due)}
const I={
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  l:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  r:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'
};

/* ===== zapis: baza Claude albo pamięć przeglądarki ===== */
const LKEY='planer-v1';
const Store={items:new Map(),mode:'loading',col:null,
  list(k){return [...this.items.values()].filter(x=>x.kind===k)},get(id){return this.items.get(id)},
  async save(o){o=JSON.parse(JSON.stringify(o));if(!o.id)o.id=newId();o.updated=Date.now();if(!o.created)o.created=o.updated;this.items.set(o.id,o);
    if(this.col){try{await this.col.doc(o.id).set(o)}catch(e){saveErr(e)}}else this.persist();render();return o},
  async remove(id){this.items.delete(id);if(this.col){try{await this.col.doc(id).delete()}catch(e){saveErr(e)}}else this.persist();render()},
  persist(){try{localStorage.setItem(LKEY,JSON.stringify([...this.items.values()]))}catch(e){}},
  load(){try{JSON.parse(localStorage.getItem(LKEY)||'[]').forEach(x=>x&&x.id&&this.items.set(x.id,x))}catch(e){}}};
function saveErr(e){toast(e&&e.code==='quota_exceeded'?'Brak miejsca w bazie – usuń stare wpisy':'Nie zapisano – spróbuj ponownie');console.warn(e)}
function goLocal(){Store.col=null;Store.mode='local';Store.items=new Map();Store.load();render()}
async function initStore(){
  if(!window.claude||typeof window.claude.use!=='function'){goLocal();return}
  let db=null,user=null,id=null;try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){}
  try{id=user?await user.id():null}catch(e){}
  if(!db||!id){goLocal();return}
  Store.col=db.collection('data/users/'+id);Store.mode='wait';
  const tm=setTimeout(()=>{if(Store.mode==='wait')toast('Brak połączenia z bazą – próbuję dalej')},10000);
  Store.col.onSnapshot(s=>{Store.items=new Map(s.docs.map(d=>[d.id,Object.assign({},d.data(),{id:d.id})]));if(!s.metadata.fromCache){clearTimeout(tm);Store.mode='cloud'}render()},
    e=>{clearTimeout(tm);Store.mode='err';toast('Baza niedostępna');render()});
}

/* ===== dane ===== */
const SUBJ_COLORS=['#5b5bd6','#0e9f8e','#ee8a3c','#d6457f','#3d8bd9','#8a56d6','#c9a227','#4caf6d'];
function subjColor(name){const c=Store.list('class').find(x=>x.subject===name&&x.color);if(c)return c.color;let h=0;for(const ch of String(name))h=(h*31+ch.charCodeAt(0))>>>0;return SUBJ_COLORS[h%SUBJ_COLORS.length]}
const subjects=()=>[...new Set([...Store.list('class').map(c=>c.subject),...Store.list('task').map(t=>t.subject)].filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pl'));
function classOn(c,date){
  if((c.skip||[]).includes(date))return'skip';
  if(c.mode==='dates')return (c.dates||[]).includes(date);
  const d=parseD(date);if(+c.dow!==d.getDay())return false;
  if(c.from&&date<c.from)return false;if(c.to&&date>c.to)return false;
  if(+c.every===2&&c.from){const w=Math.round(diffDays(mondayOf(c.from),mondayOf(date))/7);if(w%2)return false}
  return true;
}
function classDesc(c){
  if(c.mode==='dates'){const ds=(c.dates||[]).slice().sort();return `${ds.length} ${ds.length===1?'termin':ds.length<5?'terminy':'terminów'}: ${ds.slice(0,4).map(fmtShort).join(', ')}${ds.length>4?'…':''}`}
  return `${+c.every===2?'co 2 tygodnie':'co tydzień'}, ${DOW[+c.dow]}${c.from||c.to?` (${c.from?'od '+fmtShort(c.from):''}${c.from&&c.to?' ':''}${c.to?'do '+fmtShort(c.to):''})`:''}`;
}
const TYPES=['Wykład','Ćwiczenia','Laboratorium','Seminarium','Projekt','Konwersatorium','Lektorat','Inne'];
const PRIO={1:'Wysoki',2:'Średni',3:'Niski'};
const STUDY={ongoing:'W realizacji',todo:'Do realizacji',done:'Zakończone'};
function dayItems(date){
  const out=[];
  Store.list('class').forEach(c=>{const on=classOn(c,date);if(on)out.push({type:'class',o:c,start:c.start,end:c.end,cancel:on==='skip'})});
  Store.list('shift').filter(s=>s.date===date).forEach(s=>out.push({type:'shift',o:s,start:s.start,end:s.end}));
  Store.list('task').filter(t=>t.due===date&&!t.done).forEach(t=>out.push({type:'task',o:t,start:t.dueTime||''}));
  if(typeof Chem!=='undefined')Store.list('bexp').forEach(e=>{if(!e.start)return;const sd=e.start.slice(0,10);const tm=e.start.length>10?e.start.slice(11,16):'';if(sd===date)out.push({type:'bexp',o:e,start:tm,what:'Start eksperymentu'});if(Chem.bioAdult(e))(e.periods||[]).forEach(p=>{const d=new Date(sd+'T12:00');d.setDate(d.getDate()+Chem.bioPer[p][1]);if(ymd(d)===date)out.push({type:'bexp',o:e,start:'',what:'Pomiar: '+Chem.bioPer[p][0].toLowerCase()})});const en=Chem.bioEnd(e);if(en===date&&e.status!=='done')out.push({type:'bexp',o:e,start:'',what:'Koniec eksperymentu'})});
  Store.list('study').forEach(s=>{if(s.start===date)out.push({type:'study',o:s,start:'',what:'start'});if(s.end===date)out.push({type:'study',o:s,start:'',what:'termin'})});
  return out.sort((a,b)=>(a.start?toMin(a.start):-1)-(b.start?toMin(b.start):-1));
}
const CAT={class:['uni','Zajęcia'],shift:['work','Praca'],task:['task','Zadanie'],study:['res','Badanie'],bexp:['res','Eksperyment']};

/* ===== stan i nawigacja ===== */
const TABS=['kalendarz','uczelnia','praca','zadania','badania'];
const state={calMode:'month',resPart:'chem',tab:'kalendarz',sel:today(),month:today().slice(0,7),uniSeg:'week',uniWeek:mondayOf(today()),workWeek:mondayOf(today()),taskSort:'due',taskShow:'open',studySeg:'ongoing',taskId:null,studyId:null};
function readHash(){const h=location.hash.slice(1);if(TABS.includes(h))state.tab=h}
function go(t){state.tab=t;state.taskId=state.studyId=null;try{history.replaceState(null,'','#'+t)}catch(e){}render();window.scrollTo(0,0)}
function render(){
  const v=$('#view');
  v.innerHTML=Store.mode==='loading'?'':V[state.tab]();
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===state.tab));
  if(state.tab==='badania'&&state.resPart==='chem'&&typeof Chem!=='undefined')Chem.after(v);
}
const hdr=(pre,title,extra='')=>`<header class="hdr"><div><div class="pre">${pre}</div><h1 class="big">${title}</h1></div><div style="display:flex;gap:8px">${extra}<button class="round" data-a="settings" aria-label="Ustawienia">${I.gear}</button></div></header>`;
const localNote=()=>'';

/* ===== widoki ===== */
const V={
kalendarz(){
  const t=today(),sel=state.sel;
  const seg=`<div class="seg"><button class="${state.calMode==='month'?'on':''}" data-a="calMode" data-v="month">Miesiąc</button><button class="${state.calMode==='day'?'on':''}" data-a="calMode" data-v="day">Dzień</button></div>`;

zadania(){

function sheet({title,body,onSave,onDelete,saveLabel='Zapisz',onClick}){
  const r=$('#sheet');
  r.innerHTML=`<div class="scrim" data-s="close"></div><form class="panel" novalidate autocomplete="off"><div class="ph"><i></i><h3>${esc(title)}</h3></div><div class="pb">${body}</div>
    ${onSave||onDelete?`<div class="pf">${onDelete?'<button type="button" class="btn danger" data-s="del">Usuń</button>':''}<span class="sp"></span><button type="button" class="btn" data-s="close">Anuluj</button>${onSave?`<button type="submit" class="btn primary">${esc(saveLabel)}</button>`:''}</div>`:''}</form>`;
  requestAnimationFrame(()=>r.classList.add('open'));
  const f=r.querySelector('form');let busy=false;
  f.onsubmit=async e=>{e.preventDefault();if(busy||!onSave)return;f.querySelectorAll('.err').forEach(x=>x.classList.remove('err'));
    const bad=[...f.querySelectorAll('[required]')].find(x=>!x.value.trim());if(bad){bad.classList.add('err');bad.focus();toast('Uzupełnij wymagane pole');return}
    busy=true;try{const res=await onSave(f);if(res!==false)closeSheet()}catch(err){console.error(err);toast('Nie udało się zapisać')}finally{busy=false}};
  r.onclick=async e=>{const b=e.target.closest('[data-s]');if(!b)return;const s=b.dataset.s;
    if(s==='close')closeSheet();
    else if(s==='del'){if(b.dataset.armed){await onDelete();closeSheet();toast('Usunięto')}else{b.dataset.armed=1;b.textContent='Na pewno?'}}
    else if(s==='opt'){const g=b.closest('.opts');if(!g.dataset.multi)g.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));b.classList.toggle('on',g.dataset.multi?undefined:true);const h=f.querySelector(`input[name="${g.dataset.name}"]`);if(h){h.value=[...g.querySelectorAll('.opt.on')].map(x=>x.dataset.v).join(',');h.dispatchEvent(new Event('change',{bubbles:true}))}}
    else if(s==='swatch'){f.querySelectorAll('.swatch').forEach(x=>x.classList.remove('on'));b.classList.add('on');f.color.value=b.dataset.v}
    else if(onClick)onClick(s,b,f)};
  return f;
}

function setTheme(p){try{localStorage.setItem('planer-theme',p)}catch(e){}let t=p;if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#000000':'#ffffff'}
async function copyText(txt){try{await navigator.clipboard.writeText(txt);toast('Skopiowano kopię zapasową')}catch(e){const ta=$('#imp');if(ta){ta.value=txt;ta.select();toast('Zaznaczono – skopiuj ręcznie')}}}
async function importText(txt){let a;try{a=JSON.parse(txt)}catch(e){toast('To nie jest poprawna kopia');return}if(a&&Array.isArray(a.items))a=a.items;if(!Array.isArray(a)){toast('To nie jest poprawna kopia');return}let n=0;for(const x of a)if(x&&x.kind&&x.id){await Store.save(x);n++}closeSheet();toast(`Przywrócono ${n} wpisów`)}

const Chem=(()=>{

/* ===== helpers ===== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId=()=>'k'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const MON=['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];
const nowLocal=()=>{const d=new Date();return `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const parseDT=s=>{if(!s)return new Date(NaN);const [d,t='00:00']=String(s).split('T');const [y,m,dd]=d.split('-').map(Number);const [h,mi]=t.split(':').map(Number);return new Date(y,(m||1)-1,dd||1,h||0,mi||0)};
const hoursBetween=(a,b)=>(parseDT(b)-parseDT(a))/36e5;
const fmtDT=s=>{const d=parseDT(s);if(isNaN(d))return'–';return `${d.getDate()} ${MON[d.getMonth()]} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fmtD=s=>{const d=parseDT(s);if(isNaN(d))return'–';return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`};
const num=v=>{if(v===''||v==null)return null;const x=parseFloat(String(v).replace(',','.'));return isFinite(x)?x:null};
const fmtNum=n=>{if(n==null||!isFinite(n))return'–';const a=Math.abs(n);let s=a>=100?n.toFixed(0):a>=10?n.toFixed(1):n.toFixed(2);if(s.includes('.'))s=s.replace(/\.?0+$/,'');return s.replace('.',',')};
const fmtAge=h=>{if(h==null||!isFinite(h))return'–';if(h<0)return'za '+fmtAge(-h);if(h<48)return Math.floor(h)+' h '+pad(Math.round((h%1)*60))+' min';return Math.floor(h/24)+' d '+Math.floor(h%24)+' h'};
function stats(arr){const n=arr.length;if(!n)return null;const m=arr.reduce((a,b)=>a+b,0)/n;const sd=n>1?Math.sqrt(arr.reduce((a,b)=>a+(b-m)**2,0)/(n-1)):0;return{n,m,sd}}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2300)}

async function compressImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    let max=1400,q=.82,out='';
    for(let k=0;k<10;k++){const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
      const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);cx.drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);
      if(out.length<230000)return out;if(q>.55)q-=.1;else max=Math.round(max*.8)}

    else if(a==='lmode'){m.labelMode=b.dataset.v;draw()}
    else if(a==='ldel'){snap();m.lanes.splice(+b.dataset.i,1);draw()}
    else if(a==='undo'&&hist.length){m=JSON.parse(hist.pop());draw()}
    else if(a==='del'){snap();m.spots.splice(+b.dataset.i,1);draw()}
    else if(a==='cancel')ov.remove();
    else if(a==='save'){if(m.start==null||m.front==null){toast('Zaznacz linię startu i czoło rozpuszczalnika');return}

  ov.addEventListener('change',ev=>{if(ev.target.id==='rfCm'){m.cm=ev.target.value.trim();draw();return}if(ev.target.dataset.li!=null){m.lanes[+ev.target.dataset.li].name=ev.target.value.trim();draw();return}const i=ev.target.dataset.i;if(i!=null&&ev.target.tagName==='INPUT'){m.spots[+i].label=ev.target.value.trim();draw()}});
  draw();
}

const libDec=v=>v===''||v==null?'':String(v).replace('.',',');
function reagLib(){const m=new Map();LIB.forEach(([n,M,d,smi,role,formula,info,c])=>m.set(n.toLowerCase(),{name:n,M:libDec(M),d:libDec(d),smiles:smi,role,formula:formula||'',info:info||'',c:libDec(c),builtin:true}));
  Store.list('syn').forEach(s=>(s.reag||[]).forEach(r=>{if(r.name&&(r.M||r.smiles)){const k=r.name.toLowerCase();const o=m.get(k)||{};m.set(k,{...o,name:r.name,M:r.M||o.M||'',d:r.d||o.d||'',smiles:r.smiles||o.smiles||'',role:r.role||o.role,c:r.c||o.c||'',fromSyn:!o.builtin&&!o.own,builtin:o.builtin,own:o.own})}}));
  Store.list('cmp').forEach(x=>{const k=(x.name||'').toLowerCase();if(!k)return;if(x.deleted){m.delete(k);return}m.set(k,{...(m.get(k)||{}),...x,own:true,id:x.id})});
  return m}
const F=['m','V','n','eq'];
/* liczy wiersz: src = co użytkownik wpisał (m, V, n lub eq); nRef = mmol substratu odniesienia */
function solveRow(r,nRef){
  const M=num(r.M),d=num(r.d),c=num(r.c);let m=num(r.m),V=num(r.V),n=num(r.n),eq=num(r.eq);const src=r.src||'m';
  if(src==='eq'&&eq!=null&&nRef)n=eq*nRef;
  if(src==='m'&&m!=null){n=M?m/M:null;V=d?m/(d*1000):(c&&n!=null?n/c:null)}
  else if(src==='V'&&V!=null){m=d?V*d*1000:null;n=m!=null&&M?m/M:(c?c*V:null);if(m==null&&n!=null&&M)m=n*M}
  else if((src==='n'||src==='eq')&&n!=null){m=M?n*M:null;V=d&&m!=null?m/(d*1000):(c?n/c:null)}
  if(src!=='eq')eq=n!=null&&nRef?n/nRef:null;
  return{m,V,n,eq};
}
function reagTable(list){
  const out=[];let nRef=null;
  list.forEach((r,i)=>{const s=solveRow(r,i===0?null:nRef);if(i===0){nRef=s.n;s.eq=s.n!=null?1:null}out.push({...r,...s})});return out;
}
const f2=x=>x==null||!isFinite(x)?'':String(Math.round(x*1000)/1000).replace('.',',');
function recalcForm(form){

  rows.forEach((row,i)=>{const r={};row.querySelectorAll('[data-f]').forEach(x=>r[x.dataset.f]=x.value);r.src=row.dataset.src||'m';
    const s=solveRow(r,i===0?null:nRef);if(i===0){nRef=s.n;s.eq=s.n!=null?1:null}
    F.forEach(k=>{const inp=row.querySelector(`[data-f=${k}]`);if(k===r.src){inp.classList.add('src');inp.classList.remove('auto')}else{inp.value=f2(s[k]);inp.classList.toggle('auto',inp.value!=='');inp.classList.remove('src')}});
    row.querySelector('.calc').textContent=i===0?'substrat odniesienia = 1 eq':''});
}

/* ===== schemat reakcji (SmilesDrawer) ===== */
function molHtml(name,smi,big){if(smi&&window.SmilesDrawer){const w=big?Math.min(340,Math.max(150,smi.length*5)):150,h=big?140:110;return `<div class="mol"><svg data-smi="${esc(smi)}" width="${w}" height="${h}"></svg><div class="mn">${esc(name||'')}</div></div>`}return `<div class="mol"><div class="mbox">${esc(name||'?')}</div></div>`}
function schemeHtml(s){const R=s.reag||[];const T=reagTable(R);const role=(r,i)=>r.role||(i===0?'sub':'rea');
  const subs=R.filter((r,i)=>role(r,i)==='sub'&&r.name);const above=R.filter((r,i)=>(role(r,i)==='rea'||role(r,i)==='cat')&&r.name);const solv=R.filter((r,i)=>role(r,i)==='solv'&&r.name);const p=s.product||{};
  if(!subs.length&&!p.name&&!p.smiles)return'';
  const eqOf=r=>{const t=T[R.indexOf(r)];return t&&t.eq!=null&&R.indexOf(r)>0?` (${fmtNum(t.eq)} eq)`:''};
  const cond=(s.conditions||'').split('\n')[0];
  return `<div class="scheme">${subs.map(r=>molHtml(r.name,r.smiles)).join('<div class="plus">+</div>')||molHtml('substrat','')}<div class="arrow"><div>${above.map(r=>esc(r.name)+eqOf(r)).join('<br>')}</div><div class="line"></div><div class="bl">${[...solv.map(r=>esc(r.name)),esc(cond)].filter(Boolean).join('<br>')}</div></div>${molHtml(p.name||'produkt',p.smiles,true)}</div>`}
function drawMolecules(root=document){if(!window.SmilesDrawer)return;
  root.querySelectorAll('svg[data-smi]:not([data-done])').forEach(svg=>{svg.setAttribute('data-done','1');if(!svg.id)svg.id='m'+newId();
    const fail=()=>{svg.outerHTML='<div class="molerr">błędny SMILES</div>'};
    try{const d=new SmilesDrawer.SvgDrawer({width:+svg.getAttribute('width')||150,height:+svg.getAttribute('height')||110,compactDrawing:false,bondThickness:1.1,padding:8});SmilesDrawer.parse(svg.dataset.smi,t=>{try{d.draw(t,svg.id,document.documentElement.dataset.theme==='light'?'light':'dark')}catch(e){fail()}},fail)}catch(e){fail()}})}
let _prevT=null;
function schedulePrev(f){clearTimeout(_prevT);_prevT=setTimeout(()=>{const box=f.querySelector('#schemePrev');if(!box)return;
  const reag=[...f.querySelectorAll('.reag-row')].map(row=>{const o={src:row.dataset.src};row.querySelectorAll('[data-f]').forEach(x=>o[x.dataset.f]=x.value.trim());return o});
  const html=schemeHtml({reag,product:{name:f.p_name.value,smiles:f.p_smiles.value},conditions:f.conditions.value});box.innerHTML=html||'<div class="hint">Wpisz substraty (rola „substrat”) i produkt – schemat narysuje się sam. Wzory rysują się z kodu SMILES.</div>';drawMolecules(box)},350)}

function aoxCalc(a){const c0=num(a.ctl);

function aoxChart(a){const {rows,ic}=aoxCalc(a);if(rows.length<2)return'';const W=320,H=170,L=34,R=10,T=10,B=26;const x1=Math.max(...rows.map(r=>r.c))*1.05||1;

const STATUS={plan:['planowana','c2'],run:['w toku','acc'],done:['zakończona','']};

const synYield=s=>{const T=reagTable(s.reag||[]);const base=T.length?T[0].n:null;const p=s.product||{};const pM=num(p.M),pm=num(p.mass);const theor=base!=null&&pM?base*pM:null;return{theor,y:theor&&pm!=null?pm/theor*100:null}};
const synPhotoIds=s=>[...(s.photos||[]),...(s.antiox||[]).flatMap(a=>a.photos||[]),...((s.column||{}).fractions||[]).flatMap(f=>f.photos||[]),...(s.analyses||[]).flatMap(a=>a.photos||[]),...(s.tlc||[]).flatMap(t=>t.photos||[]),...((s.column||{}).photos||[]),...((s.nmrH||{}).photos||[]),...((s.nmrC||{}).photos||[])];
function ranges(nums){nums=[...new Set(nums)].sort((a,b)=>a-b);const out=[];let a=null,p=null;nums.forEach(x=>{if(a==null){a=p=x}else if(x===p+1)p=x;else{out.push(a===p?''+a:a+'–'+p);a=p=x}});if(a!=null)out.push(a===p?''+a:a+'–'+p);return out.join(', ')}
const parseFr=str=>{const out=new Set();String(str||'').split(/[,;]+/).forEach(p=>{const m=p.trim().match(/^(\d+)\s*[-–]\s*(\d+)$/);if(m){for(let i=+m[1];i<=+m[2]&&i-m[1]<500;i++)out.add(i)}else if(/^\d+$/.test(p.trim()))out.add(+p.trim())});return out};
const colOf=s=>Object.assign({program:[],fractions:[],cur:0},s.column||{});

  ${L.length?L.map(x=>{const h=elapsed(x);const pl=num(x.plannedH);const T=reagTable(x.reag||[]);const st=x.steps||[];const log=(x.log||[]).slice().sort((a,b)=>parseDT(b.at)-parseDT(a.at)).slice(0,3);

   :'<div class="card empty">Nie prowadzisz teraz żadnej reakcji. Dotknij „Nowa synteza” – synteza ze statusem „w toku” pojawi się tutaj z licznikiem czasu, krokami i przebiegiem.</div>'}

function synList(){
  const q=state.q.trim().toLowerCase();let l=Store.list('syn').sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.created-a.created);
  if(q)l=l.filter(s=>JSON.stringify([s.title,s.reaction,s.reag,s.conditions,s.log,s.product,s.tlc,s.column,s.nmrH&&s.nmrH.data,s.nmrC&&s.nmrC.data,s.other,s.obs,s.tags,s.steps,s.comments,s.analyses,s.antiox]).toLowerCase().includes(q));

function columnPanel(s){
  const c=colOf(s);const step=c.program[c.cur]||{};const fv=num(c.fracVol);
  const inStep=c.fractions.filter(f=>f.step===c.cur);const usedStep=fv?inStep.length*fv:null;const pv=num(step.vol);
  const totalPlan=c.program.reduce((a,p)=>a+(num(p.vol)||0),0);const totalUsed=fv?c.fractions.length*fv:null;
  const by=k=>c.fractions.filter(f=>(f.content||'')===k).map(f=>f.n);
  return `<div class="card" style="border-color:rgba(232,196,90,.55)"><div class="label"><span>Kolumna w toku</span><span class="mono">${c.startedAt?'start '+fmtDT(c.startedAt):''}</span></div>

      <div class="mute mono" style="font-size:12.5px">${pv?`${usedStep!=null?fmtNum(usedStep):'?'} / ${fmtNum(pv)} ml`:''}${inStep.length?` · frakcje ${ranges(inStep.map(f=>f.n))}`:''}</div>
      ${pv&&usedStep!=null?`<div class="bar"><i style="width:${Math.min(100,usedStep/pv*100)}%"></i></div>`:''}</div>
    <button class="btn primary fracbtn" data-a="addFrac" data-id="${s.id}">+ Frakcja nr ${c.fractions.length+1}</button>
    <div class="row-btns" style="margin-top:10px;justify-content:space-between"><button class="btn sm" data-a="stepPrev" data-id="${s.id}" ${c.cur>0?'':'disabled'}>◀ Poprzedni etap</button><button class="btn sm" data-a="undoFrac" data-id="${s.id}" ${c.fractions.length?'':'disabled'}>Cofnij frakcję</button><button class="btn sm" data-a="stepNext" data-id="${s.id}" ${c.cur<c.program.length-1?'':'disabled'}>Następny etap ▶</button></div>
    ${pv&&usedStep!=null&&usedStep>=pv&&c.cur<c.program.length-1?'<div class="banner" style="margin-top:10px">Zużyto zaplanowaną objętość tego etapu – czas przejść do następnego eluentu.</div>':''}
  </div>
  <div class="card"><div class="label">Program elucji <button class="btn sm ghost" data-a="editCol" data-id="${s.id}">Edytuj</button></div>
    <div class="steps">${c.program.map((p,i)=>`<div class="st ${i===c.cur?'now':i<c.cur?'done':''}" data-a="setStep" data-id="${s.id}" data-i="${i}" style="cursor:pointer"><b>${i+1}</b><div class="grow">${esc(p.eluent)}<div class="mute" style="font-size:12px">${p.vol?esc(p.vol)+' ml':''}</div></div>${i===c.cur?'<span class="chip acc">teraz</span>':''}</div>`).join('')}</div>
    <div class="hint">${fv?`Frakcja = ${fmtNum(fv)} ml${c.collect?' · '+esc(c.collect):''} · razem zebrano ~${fmtNum(totalUsed)} ml${totalPlan?' z '+fmtNum(totalPlan)+' ml programu':''}`:'Ustaw objętość frakcji, żeby liczyć zużycie eluentu.'}</div></div>
  <div class="card"><div class="label">Frakcje · ${c.fractions.length} <button class="btn sm ghost" data-a="bulkFrac" data-id="${s.id}" ${c.fractions.length?'':'disabled'}>Zaznacz zakres</button></div>
    ${c.fractions.length?fracGrid(s,c):'<div class="empty">Dotknij „+ Frakcja” przy każdej zebranej probówce – eluent zapisze się sam.</div>'}
    <div class="legend" style="margin-top:10px">${Object.entries(CONTENT).map(([k,v])=>`<span><i style="background:${v[1]};height:10px;width:10px;border-radius:3px"></i>${v[0]}${by(k).length?' ('+ranges(by(k))+')':''}</span>`).join('')}</div>
    <div class="hint">Dotknij frakcji, żeby oznaczyć wynik TLC. „Zaznacz zakres” oznacza wiele naraz.</div></div>
  <div class="row-btns" style="margin-bottom:10px"><button class="btn ghost" data-a="endCol" data-id="${s.id}">Zakończ kolumnę</button></div>`;
}

    onSave:async f=>{const v=Object.fromEntries(new FormData(f));const cur=Store.get(s.id);const list=(cur.comments||[]).filter(x=>x.id!==c.id);list.push({id:c.id||newId(),at:v.at,text:v.text.trim()});await Store.save({...cur,comments:list});toast('Zapisano komentarz')},
    onDelete:isNew?null:async()=>{const cur=Store.get(s.id);await Store.save({...cur,comments:(cur.comments||[]).filter(x=>x.id!==c.id)})}});
  setTimeout(()=>{const t=$('#sheet-root textarea[name=text]');t&&isNew&&t.focus()},300)}
const ROW_MECH=(m={})=>`<div class="drow mech-row"><textarea data-f="text" rows="2" placeholder="opis etapu mechanizmu">${esc(m.text)}</textarea><button type="button" class="x" data-s="delrow" aria-label="Usuń">×</button><input class="smi full" data-f="smiles" placeholder="SMILES produktu pośredniego (opcjonalnie)" value="${esc(m.smiles)}" autocapitalize="off" spellcheck="false"></div>`;
const ROW_STEP=(p={})=>`<div class="drow" style="grid-template-columns:1fr 80px 37px"><input data-f="eluent" placeholder="np. heksan:AcOEt 10:1" value="${esc(p.eluent)}"><input data-f="vol" inputmode="decimal" placeholder="ml" value="${esc(p.vol)}"><button type="button" class="x" data-s="delrow" aria-label="Usuń">×</button></div>`;
const ROWS={reag:()=>ROW_REAG(),step:()=>ROW_STEP(),mech:()=>ROW_MECH()};
function colForm(s){
  const c=colOf(s);const prog=c.program.length?c.program:[{eluent:'',vol:''}];
  openSheet({title:'Kolumna chromatograficzna',body:`
    <div class="grid2"><label>Złoże<input name="phase" value="${esc(c.phase||'żel krzemionkowy 230–400 mesh')}"></label><label>Masa złoża (g)<input name="silica" inputmode="decimal" value="${esc(c.silica)}"></label></div>
    <div class="grid2"><label>Średnica kolumny (cm)<input name="diam" inputmode="decimal" value="${esc(c.diam)}"></label><label>Naniesienie<input name="load" value="${esc(c.load)}" placeholder="na mokro / na sucho"></label></div>
    <div class="grid2"><label>Objętość frakcji (ml)<input name="fracVol" inputmode="decimal" value="${esc(c.fracVol)}"></label><label>Zbierane w<input name="collect" value="${esc(c.collect)}" placeholder="probówki 16 ml, kolbki…"></label></div>
    <div class="fieldset"><div class="label">Program elucji (kolejne etapy)</div><div id="steps">${prog.map(ROW_STEP).join('')}</div>
      <button type="button" class="addrow" data-s="addrow" data-row="step" data-target="#steps">+ etap</button>
      <div class="hint">Każdy etap: skład eluentu i planowana objętość (ml). Kolejność = kolejność elucji.</div></div>
    <div class="grid2"><label>Połączone frakcje<input name="combined" value="${esc(c.combined||ranges(c.fractions.filter(f=>f.content==='prod').map(f=>f.n)))}" placeholder="np. 12–18"></label><label>Masa po kolumnie (mg)<input name="mass" inputmode="decimal" value="${esc(c.mass)}"></label></div>
    <label>Uwagi<textarea name="note" rows="2">${esc(c.note)}</textarea></label>
    <div class="fieldset"><div class="label">Zdjęcia</div>${photoField(c.photos,'col')}</div>`,
    onSave:async f=>{const v=Object.fromEntries(new FormData(f));const program=[...f.querySelectorAll('#steps .drow')].map(r=>({eluent:r.querySelector('[data-f=eluent]').value.trim(),vol:r.querySelector('[data-f=vol]').value.trim()})).filter(p=>p.eluent);
      const cur=Store.get(s.id);const cc=colOf(cur);const photos=await commitPhotos(f.querySelector('.photos'),s.id);for(const pid of (cc.photos||[]))if(!photos.includes(pid))await Store.remove(pid);
      await Store.save({...cur,column:{...cc,phase:v.phase,silica:v.silica,diam:v.diam,load:v.load,fracVol:v.fracVol,collect:v.collect,program,cur:Math.min(cc.cur||0,Math.max(0,program.length-1)),combined:v.combined,mass:v.mass,note:v.note,photos}});toast('Zapisano kolumnę')}});
}
async function updCol(id,fn){const s=Store.get(id);if(!s)return;const c=colOf(s);fn(c);await Store.save({...s,column:c})}
function fracForm(s,n){
  const c=colOf(s);const fr=c.fractions.find(f=>f.n===n);if(!fr)return;
  openSheet({title:`Frakcja ${n}`,body:`<div class="mono mute" style="font-size:12.5px">${esc(fr.eluent)} · ${fmtDT(fr.at)}</div>
    <label>Wynik TLC</label><div class="cpick">${Object.entries(CONTENT).map(([k,v])=>`<label><input type="radio" name="content" value="${k}" ${(fr.content||'')===k?'checked':''}><span style="background:${v[1]};color:${v[2]}">${v[0]}</span></label>`).join('')}</div>
    <div class="grid2"><label>Rf<input name="rf" value="${esc(fr.rf)}"></label><label>Eluent<input name="eluent" value="${esc(fr.eluent)}"></label></div>
    <label>Notatka<input name="note" value="${esc(fr.note)}"></label>
    <div class="tlc-row"><input type="hidden" data-f="rf"><label>Zdjęcia TLC tej frakcji</label>${photoField(fr.photos,'tlc',fr.marks)}</div>`,
    onSave:async f=>{const v=Object.fromEntries(new FormData(f));const pm=await commitPhotosM(f.querySelector('.photos'),s.id);const photos=pm.map(x=>x.id);const marks={};pm.forEach(x=>{if(x.marks)marks[x.id]=x.marks});
      const rfAuto=f.querySelector('.tlc-row [data-f=rf]').value;
      for(const pid of (fr.photos||[]))if(!photos.includes(pid))await Store.remove(pid);
      await updCol(s.id,cc=>{const x=cc.fractions.find(q=>q.n===n);Object.assign(x,{content:v.content||'',rf:v.rf||rfAuto,eluent:v.eluent,note:v.note,photos,marks})})}});
}
function bulkForm(s){
  const c=colOf(s);
  openSheet({title:'Oznacz zakres frakcji',saveLabel:'Oznacz',body:`<div class="grid2"><label>Od frakcji<input name="a" inputmode="numeric" value="1"></label><label>Do frakcji<input name="b" inputmode="numeric" value="${c.fractions.length}"></label></div>
    <label>Wynik TLC</label><div class="cpick">${Object.entries(CONTENT).map(([k,v])=>`<label><input type="radio" name="content" value="${k}" ${k==='prod'?'checked':''}><span style="background:${v[1]};color:${v[2]}">${v[0]}</span></label>`).join('')}</div>`,
    onSave:async f=>{const v=Object.fromEntries(new FormData(f));const a=+v.a,b=+v.b;if(!a||!b||b<a){toast('Podaj poprawny zakres');return false}
      await updCol(s.id,cc=>cc.fractions.forEach(x=>{if(x.n>=a&&x.n<=b)x.content=v.content||''}));toast(`Oznaczono ${a}–${b}`)}});
}

async function copyText(txt,label){try{await navigator.clipboard.writeText(txt);toast(label||'Skopiowano')}catch(err){openSheet({title:'Skopiuj ręcznie',body:`<textarea rows="12" readonly id="cpy">${esc(txt)}</textarea>`});setTimeout(()=>{const a=$('#cpy');a&&a.select()},300)}}

function curThemePref(){try{return localStorage.getItem('fs-theme')||'dark'}catch(e){return 'dark'}}
function setTheme(p){try{localStorage.setItem('fs-theme',p)}catch(e){}let t=p;if(t==='auto')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;
  const mt=document.querySelector('meta[name=theme-color]');if(mt)mt.content=t==='light'?'#f4f5f7':'#0b0f14';document.querySelectorAll('.themesel .btn').forEach(x=>x.classList.toggle('on',x.dataset.v===p));render()}
const themeCard=()=>`<div class="card" style="margin-top:4px"><div class="label">Wygląd</div><div class="themesel">${[['dark','🌙 Ciemny'],['light','☀️ Jasny'],['auto','Jak w telefonie']].map(([k,l])=>`<button type="button" class="btn sm ${curThemePref()===k?'on':''}" data-s="theme" data-v="${k}">${l}</button>`).join('')}</div></div>`;
/* ===== sheet ===== */
function closeSheet(){const r=$('#sheet-root');r.classList.remove('open');setTimeout(()=>{if(!r.classList.contains('open'))r.innerHTML=''},260)}
function openSheet({title,body,onSave,onDelete,onAction,saveLabel='Zapisz'}){
  const root=$('#sheet-root');
  root.innerHTML=`<div class="backdrop" data-s="close"></div><form class="sheet" novalidate autocomplete="off">
   <div class="sheet-h"><div class="grab"></div><h3>${esc(title)}</h3></div><div class="sheet-b">${body}</div>
   <div class="sheet-f">${onDelete?'<button type="button" class="btn ghost bad" data-s="del">Usuń</button>':''}<span class="sp"></span><button type="button" class="btn ghost" data-s="close">${onSave?'Anuluj':'Zamknij'}</button>${onSave?`<button type="submit" class="btn primary">${esc(saveLabel)}</button>`:''}</div></form>`;
  requestAnimationFrame(()=>root.classList.add('open'));
  const form=root.querySelector('form');let busy=false;
  form.onsubmit=async ev=>{ev.preventDefault();if(busy||!onSave)return;form.querySelectorAll('.err').forEach(x=>x.classList.remove('err'));
    const bad=[...form.querySelectorAll('[required]')].find(x=>!x.value.trim());if(bad){bad.classList.add('err');bad.focus();toast('Uzupełnij wymagane pola');return}
    busy=true;try{const r=await onSave(form);if(r!==false)closeSheet()}catch(err){console.error(err);toast('Coś poszło nie tak')}finally{busy=false}};
  root.onclick=async ev=>{const b=ev.target.closest('[data-s]');if(!b)return;const s=b.dataset.s;
    if(s==='close')closeSheet();
    else if(s==='del'){if(b.dataset.armed){await onDelete();closeSheet();toast('Usunięto')}else{b.dataset.armed='1';b.textContent='Na pewno usunąć?'}}
    else if(s==='addrow'){form.querySelector(b.dataset.target).insertAdjacentHTML('beforeend',ROWS[b.dataset.row]());const rows=form.querySelectorAll(b.dataset.target+' .drow');const last=rows[rows.length-1];last&&last.querySelector('input').focus();if(b.dataset.row==='reag')recalcForm(form)}
    else if(s==='delrow'){b.closest('.drow').remove();recalcForm(form)}
    else if(s==='delphoto')b.closest('.thumb').remove();
    else if(s==='rf')openRfEditor(b.closest('.thumb'));
    else if(s==='bands')openBandEditor(b.closest('.thumb'));
    else if(onAction)onAction(s,b,form)};
  root.onchange=async ev=>{const inp=ev.target;if(inp.type!=='file'||!inp.files.length||!inp.closest('.photos'))return;const files=[...inp.files];inp.value='';const lab=inp.closest('label');
    toast(files.length>1?`Przetwarzam ${files.length} zdjęcia…`:'Przetwarzam zdjęcie…');
    for(const f of files){const d=await compressImage(f).catch(()=>null);if(!d){toast('Nie udało się wczytać zdjęcia');continue}const pid='tmp'+newId();pendingPhotos.set(pid,d);const pk=lab.closest('.photos').dataset.key;const isT=pk==='tlc';lab.insertAdjacentHTML('beforebegin',thumbEdit(pid,null,isT?'Rf':pk==='an'?'Pasma':false));if(isT&&files.length===1)openRfEditor(lab.previousElementSibling);if(pk==='an'&&files.length===1)openBandEditor(lab.previousElementSibling)}};
  return form;
}

function balgSvg(p){const as=BASSAY[p];const C='#e8457a',G='var(--soft,#888)';

  if(as==='apo'){const q={necro:[30,10,110,50],late:[140,10,150,50],live:[30,60,110,50],early:[140,60,150,50]};const lab={necro:'nekroza\nAnnV− PI+',late:'późna apoptoza\nAnnV+ PI+',live:'żywe\nAnnV− PI−',early:'wczesna apoptoza\nAnnV+ PI−'};
    const dots=(cx,cy,n,sx,sy)=>{let o='';let s=7;for(let i=0;i<n;i++){s=(s*9301+49297)%233280;const a=s/233280;s=(s*9301+49297)%233280;const b=s/233280;o+=`<circle cx="${(cx+(a-.5)*sx).toFixed(1)}" cy="${(cy+(b-.5)*sy).toFixed(1)}" r="1.6" fill="currentColor" fill-opacity=".55"/>`}return o};
    return `<svg viewBox="0 0 300 130" class="balgsvg" role="img" aria-label="Wykres Annexin V vs PI z czterema kwadrantami">${Object.entries(q).map(([k,[x,y,w,h]])=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${k===p?C:'transparent'}" fill-opacity=".16" stroke="${k===p?C:'transparent'}"/>`).join('')}<line x1="140" y1="10" x2="140" y2="110" stroke="currentColor" stroke-dasharray="3 3"/><line x1="30" y1="60" x2="290" y2="60" stroke="currentColor" stroke-dasharray="3 3"/>${dots(62,92,60,44,24)}${dots(175,95,22,50,18)}${dots(185,40,16,50,22)}${dots(55,40,8,30,20)}${Object.entries(q).map(([k,[x,y,w,h]])=>lab[k].split('\n').map((t,i)=>`<text x="${x+w-4}" y="${y+12+i*11}" font-size="${i?9:10}" text-anchor="end" fill="${k===p?C:'currentColor'}" font-weight="${k===p?700:500}">${t}</text>`).join('')).join('')}<line x1="30" y1="110" x2="290" y2="110" stroke="currentColor"/><line x1="30" y1="10" x2="30" y2="110" stroke="currentColor"/><text x="160" y="126" font-size="10.5" text-anchor="middle" fill="currentColor">Annexin V-FITC →</text><text x="14" y="60" font-size="10.5" fill="currentColor" transform="rotate(-90 14 60)" text-anchor="middle">PI →</text></svg>`}
  const f=x=>110-(88*Math.exp(-((((x-80)/9))**2))+40*Math.exp(-((((x-200)/12))**2))+(x>90&&x<190?16:0)*(1-Math.exp(-((((x-90)/6))**2)))*(1-Math.exp(-((((x-190)/6))**2))));
  let d='';for(let x=20;x<=280;x+=2)d+=(x>20?'L':'M')+x+','+f(x).toFixed(1);
  const reg={g1:[60,100],s:[100,180],g2m:[180,225]}[p]||[0,0];let area=`M${reg[0]},110`;for(let x=reg[0];x<=reg[1];x+=2)area+=`L${x},${f(x).toFixed(1)}`;area+=`L${reg[1]},110Z`;
  return `<svg viewBox="0 0 300 130" class="balgsvg" role="img" aria-label="Histogram zawartości DNA: G0/G1, S, G2/M"><path d="${area}" fill="${C}" fill-opacity=".22"/><path d="${d}" fill="none" stroke="currentColor" stroke-width="2"/><line x1="20" y1="110" x2="280" y2="110" stroke="currentColor"/><text x="80" y="16" font-size="10.5" text-anchor="middle" fill="${p==='g1'?C:'currentColor'}" font-weight="${p==='g1'?700:500}">G0/G1 (2n)</text><text x="140" y="80" font-size="10.5" text-anchor="middle" fill="${p==='s'?C:'currentColor'}" font-weight="${p==='s'?700:500}">S</text><text x="204" y="58" font-size="10.5" text-anchor="middle" fill="${p==='g2m'?C:'currentColor'}" font-weight="${p==='g2m'?700:500}">G2/M (4n)</text><text x="150" y="126" font-size="10.5" text-anchor="middle" fill="currentColor">PI-A (DNA, skala liniowa) →</text></svg>`}

const bprocs=p=>Store.list('bproc').filter(x=>!p||(x.params||[]).includes(p)).sort((a,b)=>(a.name||'').localeCompare(b.name||'','pl'));
function bprocHtml(p){const L=bprocs(p);
  return `<div class="bproc"><div class="bproc-h"><b>Twoje procedury · ${esc(BPARL[p])}</b><span class="sp"></span><button class="btn sm" data-a="bProcFromAlg" data-v="${p}">z algorytmu</button><button class="btn sm primary" data-a="bProcNew" data-v="${p}">+ procedura</button></div>
  ${L.length?L.map(x=>{const n=(x.steps||[]).length,d=(x.done||[]).filter(i=>i<n).length;return `<div class="bproc-row" data-a="bProcOpen" data-id="${x.id}"><div class="grow"><b>${esc(x.name)}</b><span class="mute">${n} ${n===1?'krok':n<5&&n>1?'kroki':'kroków'}${(x.params||[]).length>1?' · '+x.params.map(k=>BPARL[k]).join(', '):''}</span></div>${d?`<span class="bproc-pg"><i style="width:${Math.round(d/n*100)}%"></i></span><small class="mute">${d}/${n}</small>`:''}<span class="mute">›</span></div>`}).join('')
   :`<div class="hint">Brak własnych procedur dla tego parametru. Dodaj swoją („+ procedura”) albo zacznij od kroków z algorytmu powyżej i dopasuj je do swojego protokołu.</div>`}</div>`}
function bprocFromAlg(p){const a=BALG[BASSAY[p]];if(!a)return{params:[p]};
  const params=BPAR.map(x=>x[0]).filter(k=>BASSAY[k]===BASSAY[p]);
  const steps=[...a.kroki.map(t=>({t})),{t:'Bramkowanie: '+a.bramki.join(' → ')},{t:'Liczenie: '+(BPARAM_HOW[p]||a.liczenie).replace('Twoja liczba = ','')}];
  return{name:a.name,params,steps,note:''}}
const stepRow=(s={},i)=>`<div class="pstep"><span class="pnum">${i+1}</span><textarea name="st" rows="2" placeholder="Co zrobić w tym kroku…">${esc(s.t||'')}</textarea><input name="sm" inputmode="decimal" placeholder="min" value="${esc(s.min||'')}" aria-label="Czas w minutach"><div class="pact"><button type="button" class="btn sm ghost" data-s="pup" aria-label="W górę">↑</button><button type="button" class="btn sm ghost" data-s="pdown" aria-label="W dół">↓</button><button type="button" class="btn sm ghost bad" data-s="pdel" aria-label="Usuń krok">×</button></div></div>`;
function bprocForm(x={},p){const isNew=!x.id;const params=x.params||[p||BS.param];const steps=(x.steps&&x.steps.length?x.steps:[{}]);
  openSheet({title:isNew?'Nowa procedura':'Edytuj procedurę',body:`<label>Nazwa *<input name="name" required value="${esc(x.name||'')}" placeholder="np. ROS – DCFH-DA, jelito L3"></label>
    <div class="flab">Dla parametrów</div><div class="bradio">${BPAR.map(([k,l])=>`<label><input type="checkbox" name="params" value="${k}" ${params.includes(k)?'checked':''}><span>${l}</span></label>`).join('')}</div>
    <div class="flab" style="margin-top:12px">Kroki po kolei</div><div id="psteps">${steps.map(stepRow).join('')}</div>
    <button type="button" class="addrow" data-s="padd">+ krok</button>
    <label style="margin-top:12px">Odczynniki, ustawienia cytometru, uwagi<textarea name="note" rows="3" placeholder="np. DCFH-DA 10 µM w PBS; FITC 530/30; 10 000 zdarzeń">${esc(x.note||'')}</textarea></label>
    <div class="hint">Kolejność zmieniasz strzałkami ↑ ↓. Czas (min) jest opcjonalny – pojawi się przy kroku.</div>`,
    onAction:(s,b,f)=>{const box=f.querySelector('#psteps');const row=b.closest('.pstep');
      if(s==='padd'){box.insertAdjacentHTML('beforeend',stepRow({},box.children.length));box.lastElementChild.querySelector('textarea').focus()}
      if(s==='pdel'&&row){row.remove();if(!box.children.length)box.insertAdjacentHTML('beforeend',stepRow({},0))}
      if(s==='pup'&&row&&row.previousElementSibling)box.insertBefore(row,row.previousElementSibling);
      if(s==='pdown'&&row&&row.nextElementSibling)box.insertBefore(row.nextElementSibling,row);
      box.querySelectorAll('.pnum').forEach((n,i)=>n.textContent=i+1)},
    onSave:async f=>{const ps=[...f.querySelectorAll('[name=params]:checked')].map(c=>c.value);if(!ps.length){toast('Zaznacz co najmniej jeden parametr');return false}
      const st=[...f.querySelectorAll('.pstep')].map(r=>({t:r.querySelector('textarea').value.trim(),min:r.querySelector('[name=sm]').value.trim()})).filter(s=>s.t);
      if(!st.length){toast('Dodaj co najmniej jeden krok');return false}
      const same=x.id&&JSON.stringify((x.steps||[]).map(s=>s.t))===JSON.stringify(st.map(s=>s.t));
      await Store.save({...x,kind:'bproc',name:f.name.value.trim(),params:ps,steps:st,note:f.note.value.trim(),done:same?(x.done||[]):[]});toast('Zapisano procedurę')},
    onDelete:isNew?null:()=>Store.remove(x.id)});
}
function bprocSheet(id){const x=Store.get(id);if(!x)return;const done=new Set(x.done||[]);const n=(x.steps||[]).length;
  const body=()=>`<div class="bproc-meta">${(x.params||[]).map(k=>`<span>${esc(BPARL[k])}</span>`).join('')}</div>
    <div class="bproc-pg big"><i style="width:${n?Math.round(done.size/n*100):0}%"></i></div><div class="mute" style="font-size:12.5px;margin:4px 0 10px">${done.size} z ${n} kroków zrobione · dotknij kroku, żeby go odhaczyć</div>
    <ol class="bproc-steps">${(x.steps||[]).map((s,i)=>`<li class="${done.has(i)?'ok':''}" data-s="ptog" data-i="${i}"><span class="pchk">${done.has(i)?'✓':i+1}</span><div class="grow">${esc(s.t)}${s.min?`<small>⏱ ${esc(s.min)} min</small>`:''}</div></li>`).join('')}</ol>
    ${x.note?`<div class="bproc-note"><b>Odczynniki / ustawienia</b>${esc(x.note)}</div>`:''}
    <div class="row-btns" style="margin-top:12px"><button type="button" class="btn sm" data-s="pedit">Edytuj</button><button type="button" class="btn sm" data-s="pcopy">Duplikuj</button>${done.size?'<button type="button" class="btn sm ghost" data-s="preset">Wyczyść odhaczenia</button>':''}</div>`;
  openSheet({title:x.name,body:body(),onAction:async(s,b,f)=>{
    if(s==='ptog'){const i=+b.dataset.i;done.has(i)?done.delete(i):done.add(i);x.done=[...done].sort((a,c)=>a-c);f.querySelector('.sheet-b').innerHTML=body();await Store.save({...x})}
    if(s==='preset'){done.clear();x.done=[];f.querySelector('.sheet-b').innerHTML=body();await Store.save({...x})}
    if(s==='pedit'){closeSheet();setTimeout(()=>bprocForm(Store.get(id)||x),280)}
    if(s==='pcopy'){const{id:_,...rest}=x;closeSheet();setTimeout(()=>bprocForm({...rest,name:x.name+' (kopia)',done:[]}),280)}}});
}
